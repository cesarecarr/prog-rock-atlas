const fullDur=a=>{const t=(TRK[a]||{}).t||[];const s=t.reduce((x,r)=>x+(r[3]||0),0);if(!s)return '';const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' sa '+(m%60)+' dk':m+' dk'};

/* ---------- öne çıkan parça eşleşmesi ---------- */
function featIdx(a){ // album obj -> Set of track indexes that are "öne çıkan"
  if(a._feat)return a._feat;const out=new Set();const t=(TRK[a.id]||{}).t||[];
  const fs=arr(a.tr).map(x=>fold(String(x).split(/ — | - |\(/)[0].trim())).filter(Boolean);
  t.forEach((r,i)=>{const f=fold(r[2]);if(fs.some(x=>x.length>2&&(f.startsWith(x)||x.startsWith(f))))out.add(i)});
  return a._feat=out}
function item(a,i){const r=TRK[a.id].t[i];const g=N['g:'+a.g].o;return {a:a.id,i,t:r[2],s:r[3],yt:r[4]||'',sp:r[5]||'',ar:g.name,al:a.t,y:a.y,cov:a.cov}}
function playableIdx(a){return ((TRK[a.id]||{}).t||[]).map((r,i)=>r[4]?i:-1).filter(i=>i>=0)}
function pickOne(a){ // bir albümden temsilci parça: önce öne çıkan + çalınabilir, sonra ilk çalınabilir
  const p=playableIdx(a);if(!p.length)return null;const f=[...featIdx(a)].find(i=>p.includes(i));return item(a,f??p[0])}

/* ---------- albüm sayfası: parça listesi ---------- */
function albumTracks(a){
  const T=TRK[a.id];const tr=arr(a.tr);
  if(!T||!T.t.length){return tr.length?`<div class="sec"><h3>Öne çıkan parçalar</h3><ol class="tr">${tr.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`:''}
  const P=playableIdx(a),F=featIdx(a);const discs=new Set(T.t.map(r=>r[0])).size>1;let lastD=0;
  let h=`<div class="sec playbar">${P.length?`<button class="act pri" data-play="alb:${esc(a.id)}:${P[0]}">${IC.play}Albümü çal</button>`:''}<span class="muted">${T.t.length} parça${fullDur(a.id)?' · '+fullDur(a.id):''}${P.length<T.t.length?' · '+(T.t.length-P.length)+' parça çalınamıyor':''}</span></div>`;
  h+=`<div class="sec"><h3>Parçalar${F.size?' · <span style="color:var(--note)">★</span> öne çıkan':''}</h3>`;
  T.t.forEach((r,i)=>{if(discs&&r[0]!==lastD){lastD=r[0];h+=`<div class="disc">${r[0]}. disk</div>`}
    const ok=!!r[4];const now=PL.q[PL.i]&&PL.q[PL.i].a===a.id&&PL.q[PL.i].i===i;
    h+=`<button class="trk${ok?'':' off'}${now?' now':''}" ${ok?`data-play="alb:${esc(a.id)}:${i}"`:''}><span class="no">${r[1]}</span><span class="tn">${esc(r[2])}${F.has(i)?'<i>★</i>':''}</span><span class="du">${ok?mmss(r[3]):'—'}</span><span class="pb">${IC.play}</span></button>`});
  h+=`</div>`;
  if(!P.length)h+=`<p class="note">Bu albüm YouTube'da bulunamadı.${T.sp?` <a href="https://open.spotify.com/album/${esc(T.sp)}" target="_blank" rel="noopener">Spotify'da aç ↗</a>`:''}</p>`;
  return h}
function groupPlay(g){const al=(albByGroup[g.id]||[]).slice().sort((a,b)=>a.y-b.y);const q=al.map(pickOne).filter(Boolean);
  return q.length?`<div class="sec playbar"><button class="act pri" data-play="grp:${esc(g.id)}">${IC.play}Grubu dinle</button><span class="muted">her albümden bir parça · ${q.length}</span></div>`:''}
function personAlbums(p){return D.albums.filter(a=>a.k.some(([pid])=>pid===p.id)).sort((a,b)=>a.y-b.y)}
function personPlay(p){const q=personAlbums(p).map(pickOne).filter(Boolean);
  return q.length?`<div class="sec playbar"><button class="act pri" data-play="per:${esc(p.id)}">${IC.play}Yolculuğunu dinle</button><span class="muted">çaldığı albümlerden, yıl sırasıyla · ${q.length}</span></div>`:''}
function buildQueue(spec){const [k,id,i]=spec.split(':');
  if(k==='alb'){const a=N['a:'+id].o;return {q:playableIdx(a).map(j=>item(a,j)),start:Math.max(0,playableIdx(a).indexOf(+i)),name:a.t}}
  if(k==='grp'){const g=N['g:'+id].o;return {q:(albByGroup[id]||[]).slice().sort((a,b)=>a.y-b.y).map(pickOne).filter(Boolean),start:0,name:g.name+' · her albümden bir parça'}}
  if(k==='per'){const p=N['p:'+id].o;return {q:personAlbums(p).map(pickOne).filter(Boolean),start:0,name:p.name+' · yolculuk'}}
  return {q:[],start:0}}

/* ---------- oynatıcı (YouTube, sayfadan çıkmadan) ---------- */
const PL={q:[],i:-1,name:'',yt:null,api:null,mode:'yt',state:-1,err:''};
function loadYT(){if(PL.api)return PL.api;
  PL.api=new Promise((res,rej)=>{if(window.YT&&YT.Player)return res(YT);
    const t=setTimeout(()=>rej(new Error('timeout')),9000);
    window.onYouTubeIframeAPIReady=()=>{clearTimeout(t);res(YT)};
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.onerror=()=>{clearTimeout(t);rej(new Error('blocked'))};document.head.appendChild(s)});
  PL.api.catch(()=>{PL.mode='link'});return PL.api}
function playSpec(spec){const Q=buildQueue(spec);if(!Q.q.length){toast('Çalınabilir parça yok');return}
  PL.q=Q.q;PL.i=Q.start;PL.name=Q.name;count();startCur(true)}
function startCur(user){const x=PL.q[PL.i];if(!x)return;PL.err='';showDock();drawDock();markPlaying();refreshTrackRows();
  if(PL.mode==='link'){drawDock();return}
  const go=()=>{try{
    if(!PL.yt){$('#ytbox').innerHTML='<div id="ytp"></div>';
      let readyT=setTimeout(()=>{if(!PL.ready){PL.mode='link';drawDock()}},10000);
      PL.yt=new YT.Player('ytp',{host:'https://www.youtube-nocookie.com',videoId:x.yt,width:'100%',height:'100%',
        playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1},
        events:{onReady:e=>{PL.ready=true;clearTimeout(readyT);e.target.playVideo()},
          onStateChange:e=>{PL.state=e.data;if(e.data===0)next();drawDock()},
          onError:e=>{PL.err=(e.data===101||e.data===150)?'Bu video gömülemiyor':'Video açılamadı';drawDock();setTimeout(()=>{if(PL.err)next()},2500)}}})}
    else{PL.yt.loadVideoById(x.yt)}
  }catch(e){PL.mode='link';drawDock()}};
  if(window.YT&&YT.Player)go();else loadYT().then(go,()=>drawDock())}
function next(){if(PL.i<PL.q.length-1){PL.i++;startCur()}else{PL.state=0;drawDock();toast('Liste bitti')}}
function togglePlay(){if(PL.mode==='link'||!PL.yt||!PL.ready){openYT();return}
  if(PL.state===1)PL.yt.pauseVideo();else PL.yt.playVideo()}
function openYT(){const x=PL.q[PL.i];if(x&&x.yt)window.open('https://www.youtube.com/watch?v='+x.yt,'_blank','noopener')}
function stopPlay(){try{PL.yt&&PL.yt.destroy()}catch(e){}PL.yt=null;PL.ready=false;PL.q=[];PL.i=-1;PL.state=-1;$('#ytbox').innerHTML='';
  document.body.classList.remove('playing');setDockH();markPlaying();refreshTrackRows()}
function showDock(){document.body.classList.add('playing');setDockH()}
function setDockH(){requestAnimationFrame(()=>{const h=document.body.classList.contains('playing')?$('#dock').offsetHeight:0;
  document.documentElement.style.setProperty('--dockH',h+'px');setSheet(sheetState)})}
function DK(){return document.body.classList.contains('playing')?($('#dock').offsetHeight||0):0}
function drawDock(){const x=PL.q[PL.i];if(!x)return;
  $('#dinfo').innerHTML=`<b>${esc(x.t)}</b><small>${esc(x.ar)} · ${esc(x.al)} (${x.y})</small>`+
    (PL.err?`<em>${esc(PL.err)} — sıradakine geçiliyor</em>`:PL.mode==='link'?`<em>Burada çalınamıyor — ▶ YouTube'da açar</em>`:PL.q.length>1?`<em style="color:var(--muted)">${PL.i+1}/${PL.q.length} · ${esc(PL.name)}</em>`:'');
  $('#dplay').innerHTML=PL.state===1?IC.pause:IC.play;
  $('#dnext').style.visibility=PL.i<PL.q.length-1?'visible':'hidden';
  if(PL.mode==='link'||!PL.yt){$('#ytbox').innerHTML=`<div class="cvr" data-cov="${esc(x.cov)}"></div>`;setCover($('#ytbox .cvr'),x.cov,false)}
  if(document.getElementById('qlist')&&$('#queue').classList.contains('show'))drawQueue()}
function markPlaying(){document.querySelectorAll('.n.playing').forEach(e=>e.classList.remove('playing'));const x=PL.q[PL.i];
  if(x){N['a:'+x.a]&&N['a:'+x.a].el.classList.add('playing');const g=N['a:'+x.a]&&N['a:'+x.a].o.g;g&&N['g:'+g].el.classList.add('playing')}}
function refreshTrackRows(){if(cur&&cur.startsWith('a:')){const st=$('#sbody').scrollTop;render(N[cur]);$('#sbody').scrollTop=st}}
function drawQueue(){const x=PL.q[PL.i];
  $('#qlist').innerHTML=PL.q.map((y,i)=>`<button class="trk${i===PL.i?' now':''}" data-qi="${i}"><span class="no">${i+1}</span><span class="tn">${esc(y.t)}<small style="display:block;color:var(--muted);font-weight:400;font-size:12.5px">${esc(y.ar)} · ${esc(y.al)} (${y.y})</small></span><span class="du">${mmss(y.s)}</span></button>`).join('');
  $('#qhead').textContent=PL.name||'Çalan liste';
  $('#qlinks').innerHTML=x?`<button data-qa="map">Haritada göster</button><button data-qa="share">${IC.share.replace('<svg','<svg width="15" height="15"')} Paylaş</button>`+
    (x.yt?`<a href="https://www.youtube.com/watch?v=${esc(x.yt)}" target="_blank" rel="noopener"><span class="dot" style="background:#ff3b30"></span>YouTube ↗</a>`:'')+
    (x.sp?`<a href="https://open.spotify.com/track/${esc(x.sp)}" target="_blank" rel="noopener"><span class="dot" style="background:#1DB954"></span>Spotify ↗</a>`:''):''}

/* ---------- notlarım (bu cihazda) ---------- */
const NL='atlasD1notes';let NOTES={};try{NOTES=JSON.parse(localStorage.getItem(NL)||'{}')}catch(e){}
function saveNotes(){try{localStorage.setItem(NL,JSON.stringify(NOTES))}catch(e){}markNotes();$('#notesBtn').classList.toggle('has',Object.keys(NOTES).length>0)}
function markNotes(){Object.keys(N).forEach(id=>N[id].el&&N[id].el.classList.toggle('noted',!!NOTES[id]))}
let editing=false;
function noteBlock(n){const id=idOf(n);const v=NOTES[id];
  if(editing)return `<div class="mynote"><h3 class="sec" style="margin:0">Notum</h3><textarea id="ntext" placeholder="Ne dikkatini çekti? Hangi parçayı, hangi bağlantıyı hatırlamak istiyorsun?">${esc(v?v.t:'')}</textarea>
    <div class="actions" style="margin-top:8px"><button class="act pri" data-act="nsave">Kaydet</button><button class="act" data-act="ncancel">Vazgeç</button>${v?'<button class="act" data-act="ndel">Sil</button>':''}</div>
    <div class="meta">Yalnız bu cihazda saklanır. Paylaşırken eklemeyi seçebilirsin.</div></div>`;
  if(!v)return '';
  return `<div class="mynote"><h3 class="sec" style="margin:0">Notum</h3><p>${esc(v.t)}</p><div class="meta"><span>${new Date(v.at).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</span><button data-act="nedit">Düzenle</button><button data-act="nshare">Notla paylaş</button></div></div>`}
function idOf(n){return n.type+':'+n.o.id}
function nodeTitle(id){const n=N[id];if(!n)return id;const o=n.o;return n.type==='a'?o.t+' — '+N['g:'+o.g].o.name+' ('+o.y+')':o.name}
const KIND={g:'Grup',p:'Müzisyen',a:'Albüm'};
function drawNotes(){const ids=Object.keys(NOTES).filter(id=>N[id]).sort((a,b)=>NOTES[b].at-NOTES[a].at);
  $('#nlist').innerHTML=ids.length?ids.map(id=>`<button class="nrow" data-go="${esc(id)}"><span class="k">${KIND[id[0]]}</span><b>${esc(nodeTitle(id))}</b><p>${esc(NOTES[id].t)}</p></button>`).join(''):
   `<p class="note">Henüz not yok. Bir grup, müzisyen ya da albüm açıp üstteki kalem simgesine dokun.</p>`;
  $('#nshareAll').style.display=ids.length?'':'none'}

/* ---------- paylaş ---------- */
function baseURL(){return /^https?:$/.test(location.protocol)&&!/claudeusercontent|claude\.ai|claude\.site/.test(location.hostname)?location.origin+location.pathname:ARTIFACT_URL}
function enc(o){return Object.entries(o).filter(([,v])=>v!==undefined&&v!=='').map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
async function doShare(title,text,hash){const url=baseURL()+'#'+hash;count();
  try{if(navigator.share){await navigator.share({title,text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  const all=text+'\n'+url;try{await navigator.clipboard.writeText(all);toast('Bağlantı kopyalandı')}catch(e){prompt('Kopyala',all)}}
function shareNode(id,withNote){const n=N[id];if(!n)return;const v=NOTES[id];
  const note=withNote&&v?v.t.slice(0,400):undefined;
  let text=n.type==='a'?`${n.o.t} — ${N['g:'+n.o.g].o.name} (${n.o.y})`:n.type==='p'?`${n.o.name} — ${n.o.gs.length} grupluk yolculuk`:`${n.o.name} — ${secById[n.o.sec].t}`;
  if(note)text+=`\n\n“${note}”`;
  doShare('Prog Rock Atlası',text+'\n\nProg Rock Atlası’nda aç:',enc({n:id,m:note}))}
function shareTrack(){const x=PL.q[PL.i];if(!x)return;const v=NOTES['a:'+x.a];
  doShare('Prog Rock Atlası',`♪ ${x.t} — ${x.ar}, ${x.al} (${x.y})\n\nProg Rock Atlası’nda dinle:`,enc({n:'a:'+x.a,t:x.i}))}
function shareRoute(){const ids=[...hist,cur].filter(Boolean);const names=ids.map(nodeTitle);
  doShare('Prog Rock Atlası',`Atlas’ta bir yol (${ids.length} adım):\n`+names.join(' → ')+'\n\nAynı yolu izle:',enc({yol:ids.join(',')}))}
function shareAllNotes(){const ids=Object.keys(NOTES).filter(id=>N[id]);
  const txt='Prog Rock Atlası — notlarım\n\n'+ids.map(id=>`${nodeTitle(id)}\n${NOTES[id].t}\n${baseURL()}#${enc({n:id})}`).join('\n\n');
  (navigator.share?navigator.share({title:'Notlarım',text:txt}).catch(()=>{}):navigator.clipboard.writeText(txt).then(()=>toast('Kopyalandı')).catch(()=>prompt('Kopyala',txt)))}
function routeBlock(){const ids=[...hist,cur].filter(Boolean);if(ids.length<2)return '';
  return `<div class="sec"><h3>Yolun · ${ids.length} adım</h3><div class="trail">`+ids.map((id,i)=>i===ids.length-1?`<b>${esc(nodeTitle(id).split(' — ')[0])}</b>`:`<button data-go="${esc(id)}">${esc(nodeTitle(id).split(' — ')[0])}</button>`).join(' → ')+
    `</div><div class="actions"><button class="act" data-act="rshare">${IC.share.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px;margin-right:4px"')}Bu yolu paylaş</button></div></div>`}

/* ---------- gelen bağlantı (#n=… / #yol=…) ---------- */
let INC=null,ROUTE=null;
function readHash(){const h=location.hash.slice(1);if(!h)return;const p=new URLSearchParams(h);
  if(p.get('yol')){const ids=p.get('yol').split(',').filter(id=>N[id]);if(ids.length){ROUTE={ids,i:0};hist.length=0;select(ids[0],{push:false});drawRoute()}return}
  const id=p.get('n');if(id&&N[id]){INC={id,m:p.get('m')||''};select(id,{push:false});
    const t=p.get('t');if(t!==null&&id.startsWith('a:')){const a=N[id].o;if((TRK[a.id]||{}).t&&TRK[a.id].t[+t]&&TRK[a.id].t[+t][4]){
      PL.q=playableIdx(a).map(j=>item(a,j));PL.i=Math.max(0,playableIdx(a).indexOf(+t));PL.name=a.t;PL.state=-1;showDock();drawDock();loadYT()}}}}
function incomingBlock(n){if(!INC||INC.id!==idOf(n))return '';
  return `<div class="incoming"><b>Sana gönderildi</b>${INC.m?`<p>“${esc(INC.m)}”</p>`:'<p>Bir arkadaşın bunu seninle paylaştı.</p>'}</div>`}
function drawRoute(){if(!ROUTE){$('#routebar').classList.remove('show');return}
  $('#rtxt').textContent=`Paylaşılan yol · ${ROUTE.i+1}/${ROUTE.ids.length} · ${nodeTitle(ROUTE.ids[ROUTE.i]).split(' — ')[0]}`;
  $('#rprev').disabled=ROUTE.i===0;$('#rnext').disabled=ROUTE.i===ROUTE.ids.length-1;$('#routebar').classList.add('show')}

/* ---------- DOM: dock, overlays, düğmeler ---------- */
document.body.insertAdjacentHTML('beforeend',`
<div id="dock" aria-label="Oynatıcı"><div id="ytbox"></div><button id="dinfo"></button>
  <button class="dbtn" id="dplay" aria-label="Çal / duraklat"></button><button class="dbtn" id="dnext" aria-label="Sonraki">${IC.next}</button><button class="dbtn" id="dclose" aria-label="Kapat" style="color:var(--muted)">${IC.x}</button></div>
<div class="ovl" id="queue"><div class="box"><h2 id="qhead">Çalan liste</h2><p class="m">Dokunduğun parçadan devam eder.</p><div id="qlist"></div><div class="links" id="qlinks"></div>
  <div class="actions"><button class="act" data-close="queue">Kapat</button></div></div></div>
<div class="ovl" id="notes"><div class="box"><h2>Notlarım</h2><p class="m">Bu cihazda saklanır. Haritada turuncu halkayla işaretli.</p><div id="nlist"></div>
  <div class="actions"><button class="act pri" id="nshareAll">Notlarımı paylaş</button><button class="act" data-close="notes">Kapat</button></div></div></div>
<div id="routebar"><span id="rtxt"></span><button id="rprev" aria-label="Önceki">‹</button><button id="rnext" aria-label="Sonraki">›</button><button id="rclose" aria-label="Kapat">×</button></div>`);
$('#testBtn').insertAdjacentHTML('beforebegin',`<button class="round" id="notesBtn" title="Notlarım" aria-label="Notlarım">${IC.notes}</button>`);
$('#close').insertAdjacentHTML('beforebegin',`<button class="sbtn" id="shareBtn" aria-label="Paylaş">${IC.share}</button><button class="sbtn" id="noteBtn" aria-label="Not ekle">${IC.note}</button>`);
$('#dplay').onclick=togglePlay;$('#dnext').onclick=next;$('#dclose').onclick=stopPlay;
$('#dinfo').onclick=()=>{drawQueue();$('#queue').classList.add('show')};
$('#ytbox').addEventListener('click',()=>{if(PL.mode==='link'||!PL.yt)togglePlay()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('show'));
document.querySelectorAll('.ovl').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));
$('#qlist').addEventListener('click',e=>{const b=e.target.closest('[data-qi]');if(b){PL.i=+b.dataset.qi;startCur(true)}});
$('#qlinks').addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(!b)return;const x=PL.q[PL.i];
  if(b.dataset.qa==='map'){$('#queue').classList.remove('show');select('a:'+x.a)}else shareTrack()});
$('#notesBtn').onclick=()=>{drawNotes();$('#notes').classList.add('show');count()};
$('#nlist').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){$('#notes').classList.remove('show');select(b.dataset.go)}});
$('#nshareAll').onclick=shareAllNotes;
$('#shareBtn').onclick=()=>cur&&shareNode(cur,false);
$('#noteBtn').onclick=()=>{if(!cur)return;editing=true;rerender();if(sheetState==='peek')setSheet('full');setTimeout(()=>{const t=$('#ntext');t&&t.focus()},300)};
$('#rprev').onclick=()=>{if(ROUTE&&ROUTE.i>0){ROUTE.i--;select(ROUTE.ids[ROUTE.i],{push:false});drawRoute()}};
$('#rnext').onclick=()=>{if(ROUTE&&ROUTE.i<ROUTE.ids.length-1){ROUTE.i++;select(ROUTE.ids[ROUTE.i],{push:false});drawRoute()}};
$('#rclose').onclick=()=>{ROUTE=null;drawRoute()};
function rerender(){const st=$('#sbody').scrollTop;render(N[cur]);$('#sbody').scrollTop=editing?0:st}
$('#sbody').addEventListener('click',e=>{
  const p=e.target.closest('[data-play]');if(p){e.stopPropagation();playSpec(p.dataset.play);return}
  const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
  if(k==='nsave'){const v=$('#ntext').value.trim();if(v)NOTES[cur]={t:v,at:Date.now()};else delete NOTES[cur];editing=false;saveNotes();rerender();toast(v?'Not kaydedildi':'Not silindi')}
  else if(k==='ncancel'){editing=false;rerender()}
  else if(k==='ndel'){delete NOTES[cur];editing=false;saveNotes();rerender();toast('Not silindi')}
  else if(k==='nedit'){editing=true;rerender()}
  else if(k==='nshare'){shareNode(cur,true)}
  else if(k==='rshare'){shareRoute()}},true);

/* ---------- start ---------- */
setSheet('closed');apply();fitAll(true);markNotes();$('#notesBtn').classList.toggle('has',Object.keys(NOTES).length>0);readHash();addEventListener('hashchange',readHash);
</script>
</body>
</html>
