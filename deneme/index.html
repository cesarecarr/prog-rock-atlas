<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Atlas Harita Denemesi</title>
<style>
:root{
  --bg:#f4f3f0; --bg2:#ffffff; --ink:#1b1b1d; --muted:#6a6a70; --faint:#a9a8ad; --line:#d6d4cf;
  --edge:#8f8d94; --region:rgba(0,0,0,.035); --regionMain:rgba(0,0,0,.06);
  --hi:#1f5fd1; --hiSoft:rgba(31,95,209,.14); --sheet:#ffffff; --shadow:0 -6px 24px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --bg2:#1d1d21; --ink:#ececee; --muted:#9a9aa2; --faint:#5d5d66; --line:#2f2f35;
  --edge:#6d6c75; --region:rgba(255,255,255,.03); --regionMain:rgba(255,255,255,.055);
  --hi:#7aa7ff; --hiSoft:rgba(122,167,255,.16); --sheet:#1d1d21; --shadow:0 -6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141416; --bg2:#1d1d21; --ink:#ececee; --muted:#9a9aa2; --faint:#5d5d66; --line:#2f2f35;
  --edge:#6d6c75; --region:rgba(255,255,255,.03); --regionMain:rgba(255,255,255,.055);
  --hi:#7aa7ff; --hiSoft:rgba(122,167,255,.16); --sheet:#1d1d21; --shadow:0 -6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- map ---------- */
#map{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.region{fill:var(--region);stroke:none}
.region.main{fill:var(--regionMain)}
.rlabel{font-size:calc(var(--k)*13px);fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;pointer-events:none}
.rlabel.main{font-size:calc(var(--k)*17px);fill:var(--ink)}
.e{stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.35;fill:none}
.e.out{stroke-dasharray:4 4}
.e.al{opacity:.25}
.n circle,.n rect{vector-effect:non-scaling-stroke}
.g circle{r:calc(var(--kr)*9px);fill:var(--ink);stroke:var(--bg);stroke-width:2}
.g.ext circle{fill:var(--bg);stroke:var(--muted);stroke-width:1.5;r:calc(var(--kr)*6px)}
.p circle{r:calc(var(--kr)*4.5px);fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.lbl{font-size:calc(var(--k)*12px);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:calc(var(--k)*3.5px);stroke-linejoin:round}
.g .lbl{font-weight:650;font-size:calc(var(--k)*13px)}
.g.ext .lbl{font-weight:500;fill:var(--muted);font-size:calc(var(--k)*11.5px)}
.p .lbl{font-size:calc(var(--k)*11px);fill:var(--muted)}
.a image{pointer-events:none}
.a rect{fill:var(--bg2);stroke:var(--line);stroke-width:1}
.a .lbl{font-size:calc(var(--k)*9.5px);fill:var(--muted)}
.hit{fill:transparent;stroke:none}

/* semantic zoom levels */
.z0 .p,.z0 .a,.z0 .e.al,.z0 .g .lbl,.z0 .rlabel.ext{display:none}
.z0 .g.major .lbl{display:block}
.rlabel.ext{opacity:.7}

.z0 .e.pe{opacity:.12}
.z1 .a,.z1 .e.al,.z1 .g.ext .lbl{display:none}
.z1 .p:not(.big) .lbl{display:none}
.z2 .g.ext .lbl{display:block}
/* selection */
.sel .n,.sel .e{opacity:.12}
.sel .rlabel{opacity:.4}
.sel .n.on,.sel .e.on{opacity:1}
.sel .n.on{display:block!important}
.sel .n.on .lbl{display:block!important}
.sel .e.on{stroke:var(--hi);opacity:.9;display:block!important;stroke-width:1.6}
.n.cur circle{fill:var(--hi)!important;stroke:var(--hi)!important}
.n.cur .lbl{fill:var(--hi);font-weight:700}
.n.cur rect{stroke:var(--hi);stroke-width:2.5}
.n.found circle{stroke:var(--hi)!important;stroke-width:3!important}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.bar{display:flex;gap:8px;pointer-events:auto}
#q{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:0 16px;font-size:16px;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#q:focus{border-color:var(--hi)}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);flex:none}
.round svg{width:20px;height:20px}
#res{pointer-events:auto;margin-top:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-height:50vh;overflow:auto;display:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#res.show{display:block}
#res button{display:flex;width:100%;text-align:left;padding:10px 14px;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
#res button:last-child{border-bottom:0}
#res .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;width:58px}
#res small{color:var(--muted)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);font-size:13.5px;white-space:nowrap}
.chip.on{border-color:var(--hi);color:var(--hi)}

/* ---------- zoom buttons ---------- */
#zoom{position:fixed;right:12px;z-index:15;display:flex;flex-direction:column;gap:8px;bottom:calc(24px + env(safe-area-inset-bottom));transition:bottom .25s}
#zoom .round{font-size:20px;font-weight:500}
#scaleHint{position:fixed;left:12px;z-index:15;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;transition:bottom .25s}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;height:88vh;height:88dvh;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#sheet.drag{transition:none}
.grab{padding:8px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--line);display:block}
.shead{display:flex;align-items:flex-start;gap:10px;padding:2px 16px 10px;touch-action:none}
.shead .tt{flex:1;min-width:0}
.kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shead h2{font-size:21px;line-height:1.2;margin-top:2px}
.shead .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.sbtn{width:34px;height:34px;border-radius:17px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:18px}
#sbody{overflow-y:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.lead{font-size:15px}
.more{color:var(--hi);font-size:14px;margin-top:6px}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .y{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;width:78px;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:12.5px}
.row .go{color:var(--faint);font-size:18px}
.covers{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cv{flex:none;width:104px;text-align:left}
.cv .im{width:104px;height:104px;border-radius:6px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line)}
.cv b{display:block;font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.25}
.cv small{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:13.5px}
.pill.link{border-color:var(--hi);color:var(--hi)}
.big-cover{width:150px;height:150px;border-radius:8px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;flex:none}
ol.tr{padding-left:20px}
ol.tr li{padding:4px 0;font-size:14.5px}
ul.tips{padding-left:18px}
ul.tips li{padding:3px 0}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.actions{display:flex;gap:8px;margin-top:12px}
.act{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);font-size:14px}
.act.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- test panel ---------- */
#test{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
#test.show{display:flex}
#test .box{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#test h2{font-size:19px}
#test p.m{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.task{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.task .t{display:flex;gap:10px;align-items:flex-start}
.task .num{font-weight:700;width:18px;flex:none}
.task .tx{flex:1}
.task .st{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task.run{border-color:var(--hi)}
.task.done{opacity:.6}
.tbtn{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);font-size:13px}
.tbtn.pri{background:var(--hi);border-color:var(--hi);color:#fff}
#runbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:25;background:var(--hi);color:#fff;border-radius:16px;padding:6px 8px 6px 14px;font-size:13px;display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
#runbar.show{display:flex}
#runbar button{background:#fff;color:var(--hi);border-radius:12px;height:26px;padding:0 10px;font-weight:600;font-size:12.5px;flex:none}
#runbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;display:none}

/* ---------- D1.2: müzik, not, paylaş ---------- */
:root{--note:#d98a00;--dockH:0px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--note:#ffb733}}
:root[data-theme="dark"]{--note:#ffb733}
#sheet{bottom:var(--dockH);height:calc(88dvh - var(--dockH))}
.n.noted > circle:not(.hit){stroke:var(--note)!important;stroke-width:3!important}
.n.a.noted rect{stroke:var(--note);stroke-width:3}
.n.playing > circle:not(.hit){fill:var(--note)!important}
.n.a.playing rect{stroke:var(--note);stroke-width:3}
.shead .sbtn svg{width:17px;height:17px}
.sbtn.on{color:var(--note)}
.playbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.playbar .muted{color:var(--muted);font-size:13px}
.act.pri svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.trk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.trk:last-child{border-bottom:0}
.trk .no{width:22px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
.trk .tn{flex:1;min-width:0}
.trk .tn i{font-style:normal;color:var(--note);margin-left:4px}
.trk .du{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.trk .pb{width:30px;height:30px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.trk .pb svg{width:12px;height:12px}
.trk.off{color:var(--faint)}
.trk.off .pb{visibility:hidden}
.trk.now{color:var(--hi);font-weight:600}
.trk.now .pb{border-color:var(--hi)}
.disc{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 2px}
.mynote{background:color-mix(in srgb,var(--note) 12%,var(--sheet));border:1px solid color-mix(in srgb,var(--note) 45%,var(--line));border-radius:12px;padding:10px 12px;margin-top:12px}
.mynote h3{color:var(--note)!important;margin-bottom:4px!important}
.mynote p{white-space:pre-wrap;font-size:14.5px}
.mynote .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px;align-items:center}
.mynote .meta button{color:var(--hi);font-size:13px}
.mynote textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;resize:vertical;outline:none}
.mynote textarea:focus{border-color:var(--note)}
.incoming{border-left:3px solid var(--hi);background:var(--hiSoft);border-radius:0 10px 10px 0;padding:8px 12px;margin-top:12px;font-size:14px}
.incoming b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hi);margin-bottom:2px}
.incoming p{white-space:pre-wrap}
.trail{font-size:13.5px;color:var(--muted);line-height:1.6}
.trail button{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);display:none;
  align-items:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
body.playing #dock{display:flex}
#ytbox{width:107px;height:60px;border-radius:6px;overflow:hidden;background:#000;flex:none;position:relative}
#ytbox iframe,#ytp{width:100%;height:100%;display:block;border:0}
#ytbox .cvr{position:absolute;inset:0;background:var(--bg) center/cover no-repeat}
#dinfo{flex:1;min-width:0;text-align:left;line-height:1.25}
#dinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dinfo small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dinfo em{display:block;font-style:normal;font-size:12px;color:var(--note);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;flex:none}
.dbtn svg{width:20px;height:20px}
#dplay{background:var(--ink);color:var(--bg)}

/* overlays: çalan liste, notlarım */
.ovl{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.ovl.show{display:flex}
.ovl .box{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.ovl h2{font-size:19px;margin-bottom:2px}
.ovl p.m{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.nrow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.nrow .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nrow b{display:block;font-size:15px}
.nrow p{font-size:14px;white-space:pre-wrap;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a,.links button{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}

/* paylaşılan yol */
#routebar{position:fixed;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top));z-index:25;background:var(--bg2);border:1px solid var(--hi);color:var(--ink);border-radius:18px;padding:4px 6px 4px 12px;font-size:13px;display:none;align-items:center;gap:6px;max-width:calc(100% - 24px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
#routebar.show{display:flex}
#routebar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#routebar button{width:30px;height:30px;border-radius:15px;flex:none;font-size:17px}
#routebar button:disabled{opacity:.3}
.act.pri{display:inline-flex;align-items:center;white-space:nowrap}
.mynote h3{font-size:12px!important;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.act{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.act svg,.links svg{width:15px!important;height:15px!important;flex:none;margin-right:6px}
</style>
</head>
<body>
<div id="map"><svg id="svg"><g id="world"><g id="regions"></g><g id="edges"></g><g id="nodes"></g></g></svg></div>

<div id="top">
  <div class="bar">
    <input id="q" type="search" placeholder="Grup, müzisyen, albüm ara" autocomplete="off" enterkeyhint="search">
    <button class="round" id="testBtn" title="Deneme görevleri" aria-label="Deneme görevleri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
    </button>
  </div>
  <div id="res"></div>
  <div class="chips" id="chips"></div>
</div>

<div id="runbar"><span id="runtxt"></span><button id="runDone">Bitti</button><button id="runSkip">Vazgeç</button></div>

<div id="zoom">
  <button class="round" id="zin" aria-label="Yakınlaş">+</button>
  <button class="round" id="zout" aria-label="Uzaklaş">−</button>
</div>
<div id="scaleHint"></div>

<div id="sheet" aria-live="polite">
  <div class="grab" id="grab"><i></i></div>
  <div class="shead" id="shead">
    <button class="sbtn" id="back" aria-label="Geri" style="display:none">‹</button>
    <div class="tt"><div class="kind" id="skind"></div><h2 id="stitle"></h2><div class="sub" id="ssub"></div></div>
    <button class="sbtn" id="close" aria-label="Kapat">×</button>
  </div>
  <div id="sbody"></div>
</div>

<div id="test"><div class="box">
  <h2>Deneme görevleri</h2>
  <p class="m">Görevi başlat, telefonu katılımcıya ver, açıklama yapma. Süre ve dokunuş sayısı kaydedilir; sonuçlar bu cihazda kalır.</p>
  <div id="tasks"></div>
  <div class="actions"><button class="act" id="copyRes">Sonuçları kopyala</button><button class="act" id="resetRes">Sıfırla</button><button class="act" id="closeTest">Kapat</button></div>
</div></div>
<div id="toast"></div>

<script id="data" type="application/json">{"sections": [{"no": 4, "t": "King Crimson Evreni", "x": -763, "y": -181, "main": true, "intro": "Ağın en üretken kavşağı. Robert Fripp dışında neredeyse hiçbir sabit üye yoktur; bu yüzden King Crimson, en çok \"dışarıya üye veren\" düğümdür.", "n": 10}, {"no": 8, "t": "Canterbury Scene", "x": 704, "y": 144, "main": true, "intro": "Jazz-rock, mizah ve İngiliz tuhaflığının kesiştiği alt-ağ. Soft Machine merkezdir; üyeler Caravan, Hatfield and the North, National Health, Egg ve Matching Mole arasında sürekli dolaşır. Kökte Wilde Flowers, çevrede Robert Wyatt, Kevin Ayers ve Hugh Hopper'ın solo işleri, Khan, Gilgamesh ve Dave Stewart'ın Barbara Gaskin'le yaptığı pop şarkıları yer alır.", "n": 12}, {"no": 3, "t": "Proto-Prog (1967–1970)", "x": -843, "y": -1490, "main": false, "intro": "'Progresif rock' adı henüz yokken rock'ı uzun biçimlere, klasik alıntılara, tiyatroya ve şiire doğru genişleten altmışların sonu grupları: The Nice, Procol Harum, Moody Blues, Arthur Brown, Pearls Before Swine, Aphrodite's Child, Los Angeles'tan The Doors ve Kaliforniya'daki psikedelik dönemleriyle Eric Burdon & The Animals.", "n": 1}, {"no": 5, "t": "Yes Evreni", "x": -1820, "y": 692, "main": false, "intro": "", "n": 7}, {"no": 6, "t": "ELP Evreni", "x": -2182, "y": -604, "main": false, "intro": "", "n": 2}, {"no": 7, "t": "Genesis Evreni", "x": -1259, "y": -1275, "main": false, "intro": "", "n": 5}, {"no": 9, "t": "UK, Süpergruplar ve Köprü Projeleri", "x": 2, "y": 1940, "main": false, "intro": "Ağın evrenler-arası kavşakları. Bu projeler King Crimson, Yes, ELP ve Genesis evrenlerini doğrudan birbirine bağlar.", "n": 5}, {"no": 10, "t": "Dış Halka — Bağımsız ama Aynı Ses'ten Beslenen Düğümler", "x": 894, "y": 1864, "main": false, "intro": "Büyük evrenlerin dışında kalan, aynı senfonik ve folk kaynaklardan beslenen bağımsız gruplar: Gentle Giant'ın kontrpuanı, Camel'ın melodik enstrümantalleri, Renaissance'ın klasik sesi, Curved Air'in kemanı, kemancı Darryl Way'in kendi grubu Wolf, Greenslade'in iki klavyesi, Gryphon'un ortaçağ çalgıları, Fairport Convention'ın folk rock'ı, Family'nin Roger Chapman'lı eklektik rock'ı, Barclay James Harvest'ın orkestral pastoral rock'ı ve klavyecisi Woolly Wolstenholme'un solo işleri.", "n": 4}, {"no": 11, "t": "Sonraki Kuşak I — Neo-Prog Dalgası (1981–1990)", "x": 612, "y": -1710, "main": false, "intro": "İlk büyük \"rönesans\". Punk ve new wave'in ardından, 1970'lerin symphonic prog şablonunu — özellikle Gabriel-dönemi Genesis, Camel, Pink Floyd ve VdGG'yi — yeniden üreten İngiliz kuşağı. Londra'nın Marquee Club'ı bu hareketin kalbidir. Ortak ses bağı ile eski omurgaya bağlanırlar; üye göçü kendi içlerinde döner (Clive Nolan gibi figürler birden çok grubu birbirine bağlar).", "n": 3}, {"no": 12, "t": "Sonraki Kuşak II — Amerikan Rönesansı (1985–1995)", "x": 354, "y": -2382, "main": false, "intro": "İkinci büyük \"rönesans\" ve ağın Atlantik ötesine taşması. Grunge'ın hâkim olduğu bir dönemde, ABD'li müzisyenler 1970'lerin symphonic prog'unu (özellikle Yes, Genesis, Gentle Giant) bilinçli biçimde dirilttiler. Bu kuşak, üye göçüyle değil ortak ses ve doğrudan kişisel bağ (Billy Sherwood'un Squire ile çalışması gibi) yoluyla eski omurgaya bağlanır.", "n": 1}, {"no": 13, "t": "Amerikan & Space-Rock Genişlemesi", "x": -251, "y": -2088, "main": false, "intro": "Ağın Atlantik-ötesi ve uzay-rock kanadı. Bu gruplar büyük omurgaya çoğunlukla doğrudan üye göçüyle değil, ortak ses (symphonic prog formları, uzun süitler, virtüözite) ve aynı dönemi paylaşmakla bağlanır. Kansas Amerikan symphonic prog'unu, Rush prog'u power-trio formatına taşıyan dev düğümü, Hawkwind ise İngiliz space-rock'ının çekirdeğini temsil eder. Yanlarında Amerika'dan Happy the Man ve Pavlov's Dog, Almanya'da kurulan İngiliz grubu Nektar yer alır.", "n": 3}, {"no": 16, "t": "Pink Floyd Evreni", "x": 1918, "y": -600, "main": false, "intro": "Pink Floyd ve üyelerinin solo çalışmaları: Barrett'ten The Endless River'a, Gilmour'un gitarı, Waters'ın konsept albümleri, Wright'ın solo albümleri ve Mason'ın caz/Canterbury bağlantıları. Yanında, The Dark Side of the Moon'un ses mühendisi Alan Parsons'ın Alan Parsons Project'i.", "n": 7}, {"no": 17, "t": "Hard Rock Kenarı — Blues ve Ağır Rock Komşuları", "x": -799, "y": -1845, "main": false, "intro": "Prog'la aynı kulüplerde doğan ve aynı müzisyenleri paylaşan blues-rock ve hard rock grupları: power trio Cream (Clapton, Bruce, Baker), Ten Years After, İrlanda'dan Rory Gallagher'ın Taste'i, Mick Abrahams'ın Jethro Tull'dan sonra kurduğu Blodwyn Pig, Colosseum'un jazz-rock'ı, Deep Purple, Jon Lord'un orkestra eserleri, Uriah Heep (Ken Hensley, John Wetton), Hamburglu Zarathustra'nın Hammond ağırlıklı ağır rock'ı, Almanya'dan Lucifer's Friend, Wishbone Ash, Budgie ve Rainbow (Cozy Powell, sonradan Emerson, Lake & Powell).", "n": 3}, {"no": 18, "t": "Sonraki Kuşak III — Modern Prog ve Prog Metal (1995–2020)", "x": 1004, "y": -1685, "main": false, "intro": "Dördüncü dalga: Porcupine Tree ve Steven Wilson'ın remiks mirası, Transatlantic süpergrubu, Neal Morse ve prog metalin tanımlayıcısı Dream Theater. Klasik kuşağın müzisyenleri bu grupların albümlerinde konuk olarak yeniden belirir. Yanlarında: death metal'i yetmişlerin prog'uyla birleştiren İsveçli Opeth (yapımcısı Steven Wilson), ölçü oyunları ve uzun formlarıyla Tool, Jem Godfrey'in Frost*'ı ve Liquid Tension Experiment (Portnoy, Petrucci, Rudess, Levin).", "n": 6}, {"no": 19, "t": "Art-Rock Komşuluğu — Glam, Ambient ve Elektronik Akrabalar", "x": -665, "y": 1535, "main": false, "intro": "Tam anlamıyla prog olmayan ama yolları ağın tam ortasından geçen sanatçılar: Roxy Music ve Brian Eno (Fripp, Jobson, Wetton), Phil Manzanera'nın Quiet Sun ve 801 projeleri, David Bowie'nin art-rock albümleri (Eno, Fripp, Belew, Wakeman), Mike Oldfield ve David Bedford (Kevin Ayers, Robert Wyatt, Virgin Records), Vangelis ve Jon & Vangelis (Aphrodite's Child, Jon Anderson) ve Kate Bush (David Gilmour, Peter Gabriel).", "n": 7}, {"no": 20, "t": "Zappa Evreni — Besteciler, Uçuklar ve Virtüözler", "x": -1483, "y": 1531, "main": false, "intro": "Frank Zappa, rock'ın en uzun soluklu virtüöz okulunu yönetti. Gruplarından geçen müzisyenler ağın her yerinde karşımıza çıkar: Adrian Belew (King Crimson), Terry Bozzio ve Eddie Jobson (UK), Chester Thompson (sahnede Genesis), Steve Vai ve Aynsley Dunbar. Bu bölümde Zappa'nın yanında: okul arkadaşı Captain Beefheart, Zappa'dan Mahavishnu Orchestra'ya geçen kemancı Jean-Luc Ponty, John McLaughlin'in jazz-rock'ı tanımlayan Mahavishnu Orchestra'sı ve Steve Morse'un Dixie Dregs'i.", "n": 3}, {"no": 22, "t": "Jethro Tull Evreni", "x": -2374, "y": 104, "main": false, "intro": "Ian Anderson'ın flütü, folk melodileri ve blues kökleri Jethro Tull'u prog içinde kendine ait bir dünya yaptı: This Was'ın blues'undan Thick as a Brick ve A Passion Play konsept albümlerine ve yetmişlerin sonundaki folk-rock üçlemesine. Anderson'ın solo albümleri aynı çizgiyi Thick as a Brick 2'ye kadar sürdürür.", "n": 2}, {"no": 23, "t": "Van der Graaf Evreni", "x": -1929, "y": -932, "main": false, "intro": "İngiliz prog'unun en karanlık ve en yoğun köşesi: Peter Hammill'in sesi ve sözleri, Hugh Banton'ın orgu, David Jackson'ın saksafonları ve Guy Evans'ın davulu — solo gitar olmadan. Van der Graaf Generator ile Hammill'in solo işleri elli yıldır paralel ilerliyor; aralarındaki sınır hiçbir zaman keskin olmadı.", "n": 2}, {"no": 24, "t": "Rock in Opposition — Henry Cow ve Avangart", "x": 1573, "y": 1360, "main": false, "intro": "1978'de Henry Cow, Kıta Avrupası'ndan dört grubu Rock in Opposition adıyla Londra'ya davet etti: müzik endüstrisine karşı bir hareket ve kendine ait bir üslup — çağdaş klasik müzikten ve serbest doğaçlamadan beslenen, bestelenmiş, disonant, siyasi duyarlı bir rock. Henry Cow üyelerinin (Fred Frith, Chris Cutler, Lindsay Cooper) çevresinde Art Bears, Slapp Happy'nin şarkı odaklı sapağı ve hemen yanında This Heat'in post-punk deneyleri gelişti.", "n": 5}, {"no": 25, "t": "Gong Evreni", "x": 2087, "y": 530, "main": false, "intro": "İngiltere'ye yeniden girişine izin verilmeyince Soft Machine'den ayrılmak zorunda kalan Avustralyalı Daevid Allen, Gong'u Fransa'da kurdu: psikedelik space rock, 'pothead pixie'ler ve uçan çaydanlıklarla dolu Radio Gnome mitolojisi ve Steve Hillage'ın glissando gitarı. Allen ayrıldıktan sonra Pierre Moerlen grubu perküsyon ağırlıklı bir jazz-rock topluluğuna dönüştürdü; Hillage ise kozmik yanı solo işlerine, sonra da System 7'nin dans müziğine taşıdı.", "n": 4}, {"no": 26, "t": "Led Zeppelin Evreni", "x": 1459, "y": -1267, "main": false, "intro": "Jimmy Page'in Jeff Beck'le yan yana çaldığı Yardbirds'ten New Yardbirds, 1968'de de Led Zeppelin doğdu: blues, folk ve Doğu makamları hard rock'ın modeline dönüştü. Grup John Bonham'ın 1980'deki ölümüyle sona erdi; Page, The Firm'le, David Coverdale'le ve yeniden Plant'le birlikte No Quarter'la devam etti, Plant ise synth pop'tan Raising Sand'in Americana'sına uzanan bir solo kariyer kurdu.", "n": 1}], "groups": [{"id": "stick-men-the-crimson-projekct", "name": "Stick Men", "sec": 4, "x": -912, "y": -506, "ext": false, "kurulus": "2007, Tony Levin'in Chapman Stick odaklı üçlüsü. The Crimson ProjeKCt (2011–2014): Stick Men + Adrian Belew Power Trio.", "dna": "Chapman Stick ve Touch Guitar dokuları, Crimson'un poliritmik mirası, endüstriyel-elektronik renk.", "hikaye": "Stick Men, Tony Levin'in Stick'e adanmış 2007 solo albümünden doğdu; Pat Mastelotto (davul) ve Alman Stick ustası Markus Reuter (Touch Guitar) ile kalıcı üçlüye dönüştü. King Crimson'un 2008 sonrası uzun sessizliğinde, Stick Men ile Adrian Belew'in Power Trio'su birleşip 'The Crimson ProjeKCt' adıyla Crimson repertuvarını (özellikle Discipline–THRAK dönemini) sahnede yaşattı. Levin ve Mastelotto 2013'te Crimson'a dönse de Stick Men bağımsız bir yaratıcı grup olarak devam etti; Mel Collins ve David Cross'la ortak konserler de yaptı.", "etki": "Crimson ailesinin 2010'lardaki 'yan akımı'; Stick ve Touch Guitar gibi enstrümanların modern prog'daki vitrini.", "ipucu": ["Stick Men sık sık Stravinski'nin Ateş Kuşu'nun yeniden yorumunu çalar: Stick'in orkestranın yerini nasıl aldığına kulak ver.", "Prog Noir'ı The Power to Believe'den sonra dinle: Mastelotto'nun davul sesi ikisini doğrudan bağlar.", "Levin ile Reuter'i ayırt etmeye çalış: ikisi de vurarak çalınan çok telli çalgılar kullanıyor, ama tiz bölgeyi genellikle Reuter alır."], "gecisler": "Tony Levin (Crimson, Gabriel, Bruford Levin Upper Extremities), Pat Mastelotto (Mr. Mister → Crimson), Markus Reuter (Centrozoon, Tuner) → Stick Men; Belew Power Trio → The Crimson ProjeKCt."}, {"id": "gilgamesh", "name": "Gilgamesh", "sec": 8, "x": 968, "y": -517, "ext": false, "kurulus": "1972, Londra. Klavyeci Alan Gowen'ın Canterbury caz-rock grubu.", "dna": "Fender Rhodes ve synthesizer'la baştan sona bestelenmiş uzun parçalar, temiz gitar ve akışkan elektrik bas; yumuşak dinamikler, karmaşık armoni ve kendi başına amaç olan az solo.", "hikaye": "Gilgamesh, Gowen (klavye), Phil Lee (gitar), Jeff Clyne (bas) ve Mike Travis (davul) çevresinde Londra caz-rock sahnesinden çıktı. 1973'te Hatfield and the North'la 'çifte dörtlü' olarak ortak konserler verdiler; Gowen ve Dave Stewart iki grup için birlikte yazdı — Gowen'ın kurucu üyesi olduğu National Health'in tohumu. Dave Stewart'ın yapımcılığını yaptığı ilk albüm Gilgamesh (1975), en saf Canterbury caz albümlerinden biridir. İkinci albüm Another Fine Tune You've Got Me Into'da (1978) basta Hugh Hopper, davulda Trevor Tomkins vardı. Gowen sonra Soft Heap'te çaldı, Hopper ve Richard Sinclair'le kayıt yaptı; 1981'de 33 yaşında öldü.", "etki": "Canterbury'nin en caz yönelimli kolu; Gowen'ın yazımı National Health'in sesini biçimlendirdi ve Dave Stewart'ın sonraki işlerinde sürer.", "ipucu": ["Hatfield'ın The Rotters' Club'ından hemen sonra dinle — ardından Gowen'ın rolünü duymak için National Health'in ilk albümünü.", "Parçaların ne kadar az tekrar ettiğine dikkat et: Gilgamesh oda müziği bestecileri gibi yazıyordu."], "gecisler": "Gilgamesh + Hatfield and the North (1973 'çifte dörtlü') → National Health (Gowen, 1975–76) → Gilgamesh II (1978) → Soft Heap (Gowen, Hopper, Elton Dean, Pip Pyle). Phil Lee ve Jeff Clyne ayrıca Nucleus'ta ve Ian Carr'la birlikte çaldı."}, {"id": "khan", "name": "Khan", "sec": 8, "x": 930, "y": 73, "ext": false, "kurulus": "1971, Londra. Steve Hillage'in (sonra Gong) Gong'a katılmadan önce kurduğu, gitar-merkezli Canterbury grubu. Kent Üniversitesi (Canterbury) çevresinden.", "dna": "Gitar-merkezli Canterbury prog: Hillage'in akışkan, glissando-öncesi gitarı, Stewart'ın org dokusu, prog ile hard-rock'ın kesişimi. Kansas'ın birkaç yıl sonra geliştireceği sesin habercisi.", "hikaye": "Steve Hillage, Khan'ı 1971'de basçı Nick Greenwood (Arthur Brown'ın Crazy World'ünden), davulcu Eric Peachey ve orgcu Dick Henningham ile kurdu. Space Shanty'yi (Deram, 1972) kaydettiklerinde Henningham gitmişti; klavyeyi Hillage'ın Uriel'den eski arkadaşı Dave Stewart çaldı. Albüm uzun, çok bölümlü şarkıları Hillage'ın ilk 'uzay' gitarıyla birleştirdi. Khan 1972'de dağıldı; Hillage, Kevin Ayers'ın grubunda çaldı ve 1973'te Gong'a katıldı.", "etki": "Steve Hillage'in besteci-gitarist kimliğinin doğduğu yer; Canterbury sahnesini Gong evrenine taşıyan köprü. Tek albüm ama kült gem.", "ipucu": ["Adını veren parçayı, sonra Hillage'ın Fish Rising'ini (1975) dinle: aynı gitarist, üç yıl ve bir Gong sonra.", "Dave Stewart'ın orgunu takip et: Egg ile Hatfield arasında köprü kurar."], "gecisler": "Önce → Uriel/Egg çevresi (Hillage, Stewart). Sonra → Gong & solo (Hillage), Hatfield (Stewart). Canterbury'yi Gong'un uzay-fusion'ına bağlayan halka."}, {"id": "robert-wyatt", "name": "Robert Wyatt", "sec": 8, "x": 462, "y": 245, "ext": false, "kurulus": "Solo, 1970'lerden. Soft Machine ve Matching Mole'un ardından; 1973'teki felç kazasının (bel altı felç) ardından davulu bırakıp tümüyle besteci/vokalist kimliğine yöneldi.", "dna": "Tümüyle özgün: kırılgan, yüksek, derinden duygusal vokal; jazz-etkili minimalist besteler; politik ve kişisel temalar. Canterbury'nin en şahsi, en dokunaklı sesi.", "hikaye": "Soft Machine'in davulcu-vokalisti, sonra Matching Mole'un kurucusu Wyatt, 1 Haziran 1973'te bir partide dördüncü kattan düşerek belden aşağısı felç kaldı. Tekerlekli sandalyede yeniden doğan müzisyen olarak davulu bırakıp klavye ve perküsyona, eşi ressam Alfreda Benge ile ortak bir sanatsal hayata yöneldi. Rock Bottom (1974) İngiliz müziğinin en çok saygı gören albümlerinden biri oldu. 80'lerde komünist parti üyeliğiyle politik cover single'lar ('Shipbuilding', 'At Last I Am Free') yaptı. Björk, Paul Weller, Brian Eno ve Phil Manzanera'yla çalışan Wyatt, 2014'te müziği bıraktığını açıkladı.", "etki": "Kazasından sonra prog'un en saygın 'tek başına' figürlerinden biri oldu; 'Rock Bottom' türün en sevilen solo albümlerinden. RIO/sol-politik kanada köprü.", "ipucu": ["Nick Mason'ın yapımcılığını yaptığı Rock Bottom (1974) ile başla: çoğu kazadan önce yazıldı, sonra kaydedildi.", "Sonra 'Shipbuilding'i (1982) dinle: Elvis Costello ve Clive Langer'ın şarkısı, Wyatt'ın ağzında onun oldu.", "Dinlerken Alfreda Benge'in kapaklarına bak; görüntü ve müzik ortak tek bir eser."], "gecisler": "Önce → Soft Machine, Matching Mole (Wyatt). Çevresi → Henry Cow (sol-politik bağ), Pink Floyd (Nick Mason 'Rock Bottom'ı prodükte etti). Canterbury ile RIO/avangardı bağlar."}, {"id": "egg", "name": "Egg", "sec": 8, "x": 240, "y": 354, "ext": false, "kurulus": "1968, Londra. Dave Stewart'ın (sonra Hatfield ve National Health) ilk önemli grubu. Uriel adlı grubun (Steve Hillage ile) Hillage ayrıldıktan sonraki org-merkezli üçlü hâli.", "dna": "Org-merkezli, klasik-müzik etkili (Stravinsky, bölünmüş ölçüler) cerebral prog; mizah, asimetrik ritimler, besteci-odaklı yapı. ELP'nin tam zıttı: gösterişsiz ama entelektüel.", "hikaye": "Egg, Dave Stewart, Mont Campbell, Clive Brooks ve Steve Hillage'ın Londra'daki okul grubu Uriel'den çıktı; Hillage 1968'de üniversiteye gidince trio Egg adıyla devam etti (Uriel olarak, Hillage'la birlikte, Arzachel takma adıyla doğaçlama psikedelik bir albüm de kaydettiler). İlk albümleri (1970) şarkıları, tek ölçülerdeki uzun enstrümantal parçalar ve Bach ile klasik alıntılarla karıştırdı; The Polite Force (1971) 'A Visit to Newport Hospital' ve çok bölümlü 'Long Piece No. 3' ile tarzı daha da ileri götürdü. Grup 1972'de dağıldı; The Civil Surface (1974) sonradan kalan malzemeden, nefesliler eklenerek kaydedildi.", "etki": "Dave Stewart'ın besteci kimliğinin doğduğu yer; Canterbury'nin org-merkezli, 'oda müziği' kanadının kökü. Hatfield ve National Health'in habercisi.", "ipucu": ["'Long Piece No. 3'te ölçüleri say: Egg nadiren uzun süre 4/4'te kalır.", "Egg'i The Nice'la yan yana dinle: 1970'in iki org triosu, biri gösterişli, biri düşünsel.", "Sonra Stewart'ın orgunun nereye gittiğini duymak için Hatfield and the North'a geç."], "gecisler": "Önce → Uriel (Stewart + Steve Hillage). Sonra → Hatfield and the North & National Health (Stewart), Khan (Stewart konuk). Canterbury'nin klavye-besteci kanadının başlangıç noktası."}, {"id": "peter-sinfield", "name": "Peter Sinfield", "sec": 4, "x": -933, "y": -227, "ext": false, "kurulus": "1943–2024, Londra. İlk King Crimson'ın (1969–71) söz yazarı ve ışık tasarımcısı; sahnede enstrüman çalmayan bir grup üyesi.", "dna": "Mitolojik, imge yüklü sözler — soytarılar, saraylar, kardinaller ve mevsimler; Still'de Sinfield bunları Crimson'ın nefesli çalgıcılarıyla yumuşak folk-caz düzenlemeler üzerinde kendisi söyler.", "hikaye": "Sinfield altmışların sonunda Ian McDonald'la tanıştı ve King Crimson'ın söz yazarı, ışık gösterisi sorumlusu ve giderek stüdyoda ortak yapımcısı oldu: '21st Century Schizoid Man', 'Epitaph', 'In the Court of the Crimson King' ve Lizard süitinin sözleri onundur. Fripp onu 1971 sonunda gruptan çıkardı. Roxy Music'in ilk albümünün (1972) yapımcılığını yaptı, Emerson, Lake & Palmer için (Brain Salad Surgery, Works) ve PFM'in Photos of Ghosts albümünün İngilizce sözlerini yazdı; ELP'nin Manticore şirketinde tek solo albümü Still'i (1973) kaydetti. Seksenlerde başarılı bir pop şarkı yazarı oldu (Bucks Fizz'in 'The Land of Make Believe'i, Celine Dion'un 'Think Twice'ı).", "etki": "Sinfield'ın sözleri erken prog'un imge dünyasını belirledi — Genesis'in, Yes'in ve sayısız sonraki grubun yankıladığı ortaçağ, mistik ve kıyamet tonu.", "ipucu": ["Still'i dinlemeden önce 'Epitaph' ve 'Lizard'ın sözlerini oku: aynı şiirsel ses, bu kez kendisi için şarkı söylüyor.", "Mel Collins ve Boz Burrell'ı dinle: Still, Fripp'siz Islands dönemi Crimson'ın sesidir."], "gecisler": "King Crimson (1969–71) → Roxy Music (ilk albümün yapımcısı) → ELP ve PFM (sözler) → pop şarkı yazarlığı. Still, ELP'nin Manticore şirketinden çıktı; başlık şarkısını Greg Lake söyler."}, {"id": "kevin-ayers", "name": "Kevin Ayers", "sec": 8, "x": 553, "y": 437, "ext": false, "kurulus": "Solo, 1969'dan. Soft Machine'in kurucu basçı/vokalisti Kevin Ayers, ilk albümden sonra gruptan ayrılıp kendine özgü, tembel-zarif bir solo kariyer kurdu.", "dna": "Canterbury'nin şarkıcı-söz yazarı kanadı: derin, tembel bariton vokal, sürreal/mizahi sözler, psychedelic-pop ile avangardın rahat birleşimi. Syd Barrett'ın daha sofistike akrabası.", "hikaye": "Soft Machine'in kurucu basçısı Ayers, 1968 ABD turnesinin yorgunluğuyla gruptan ayrılıp İbiza'ya çekildi ve bohem, alaycı, derin bariton sesli bir şarkı yazarı olarak solo kariyerine başladı. Genç Mike Oldfield (bas ve gitar) ile David Bedford (klavye) onun grubu The Whole World'de yetişti. 1974'teki ünlü 'June 1, 1974' konserinde Brian Eno, John Cale ve Nico ile sahne aldı. 2013'te öldü; son albümü The Unfairground (2007) geniş bir hayranlıkla karşılandı.", "etki": "Canterbury'nin 'şarkı' ruhunu solo formata taşıdı; Mike Oldfield'ı yetiştirdi. İngiliz art-pop'unun underground efendilerinden.", "ipucu": ["Joy of a Toy'da Soft Machine arkadaşları çalar (Ratledge, Wyatt, Hopper): onu Volume Two'nun yumuşak, şarkılı ikizi olarak dinle.", "Shooting at the Moon'da basta genç Mike Oldfield'a kulak ver — Tubular Bells'ten üç yıl önce.", "Albümleri virtüözlük için değil, ruh hâli için seç: Ayers'ın cazibesi sesinde ve sözlerinde."], "gecisler": "Önce → Soft Machine (Ayers). Çevresi → Mike Oldfield (Ayers'ın grubunda yetişti, sonra Tubular Bells), Brian Eno, Nico, John Cale (1974 'June 1, 1974' canlı albümü bu dörtlüyü buluşturdu)."}, {"id": "adrian-belew", "name": "Adrian Belew", "sec": 4, "x": -1194, "y": -248, "ext": false, "kurulus": "1949'da Covington, Kentucky'de doğdu. Gitara geçmiş bir davulcu; Frank Zappa onu 1977'de Nashville'de bir kulüpte keşfetti.", "dna": "Gitar hem bir ses efekti makinesi hem bir pop sesi: pedallardan ve gitar synthesizer'ından fil böğürtüleri, martılar ve korna sesleri, Beatles esintili melodiler ve söz oyunları, ardından birden Crimson tarzı iç içe geçen kalıplar.", "hikaye": "Zappa, Belew'u 1977–78 grubuna aldı (Sheik Yerbouti); David Bowie onu doğrudan Zappa'dan Stage/Lodger turnesine götürdü, ardından Remain in Light dönemindeki genişletilmiş Talking Heads kadrosuna katıldı. 1981'de Robert Fripp onu yeni King Crimson'ın şarkıcısı, ikinci gitaristi ve söz yazarı yaptı (Discipline, Beat, Three of a Perfect Pair); bu rolü çifte üçlü ve ProjeKct yıllarından 2009'a kadar sürdürdü. Crimson'ın yanında Lone Rhino (1982) ile başlayan solo kariyerini ve pop grubu The Bears'ı yürüttü; Paul Simon'ın (Graceland) ve Nine Inch Nails'in kayıtlarında çaldı. Side One (2005) Les Claypool ve Tool'dan Danny Carey'yi getirdi; kardeşler Julie ve Eric Slick'le (sonra Tobias Ralph) kurduğu Adrian Belew Power Trio 2006'dan itibaren turneye çıktı ve Stick Men'le birleşip Crimson ProjeKCt oldu (2011–14).", "etki": "Belew gürültüyü ve efektleri süs olmaktan çıkarıp müziğin parçası yaptı; Fripp'in kalıplarıyla birlikte Tool'a, math-rock gruplarına ve modern prog metal gitarına doğrudan akan seksenler Crimson sesini tanımladı.", "ipucu": ["Lone Rhino ile başla: 'Big Electric Cat' fil gitarının en eğlenceli hâli.", "Side One onu Tool'un davulcusuyla gösterir — Crimson'dan modern ağır prog'a doğrudan bir çizgi.", "e'de Power Trio beş bölümlük enstrümantal bir süit çalar: Belew'un en 'prog' solo albümü."], "gecisler": "Frank Zappa (1977–78) → David Bowie (1978) → Talking Heads (1980–81) → King Crimson (1981–2009) → Power Trio ve Stick Men'le (Tony Levin, Pat Mastelotto, Markus Reuter) Crimson ProjeKCt. Porcupine Tree'nin Deadwing albümünde konuk."}, {"id": "king-crimson", "name": "King Crimson", "sec": 4, "x": -645, "y": 172, "ext": false, "kurulus": "1968–69, Londra. Giles, Giles & Fripp üçlüsünden doğdu; Ian McDonald ve Greg Lake'in katılımıyla 1969'da kuruldu. In the Court of the Crimson King (1969) prog rock'un sembolik doğum belgesidir.", "dna": "Mellotron'un karanlık dokusu, serbest doğaçlama (free improv), disonans, ölçü değişimleri, jazz-rock ağırlık. Hem en lirik (Crimson King) hem en sert (Red) uçları barındırır.", "hikaye": "Robert Fripp'in 'grup değil, bir çalışma biçimi' dediği King Crimson, elli yılda sekizi aşkın kadroyla yeniden kuruldu. 1969 kadrosu tek albümün ardından dağıldı (McDonald ve Giles ayrıldı, Lake ELP'ye gitti); 1970–72 arası Fripp ve söz yazarı Peter Sinfield, stüdyo müzisyenleri ve Mel Collins, Boz Burrell, Ian Wallace ile caz-orkestral bir Crimson inşa etti. 1972'de Sinfield'ı da gönderen Fripp; John Wetton, Bill Bruford, David Cross ve perküsyoncu Jamie Muir ile doğaçlamaya dayalı, metal ağırlığında bir dörtlü kurdu; Red'in (1974) ardından grubu 'dünyanın sonu yaklaşıyor' gerekçesiyle feshetti. 1981'de Adrian Belew ve Tony Levin ile kurulan Discipline dörtlüsü Afrika poliritmi, gamelan ve minimalizmi rock'a taşıdı. 1994'te 'double trio' (iki gitar, iki bas/Stick, iki davul), 2000'lerde nuevo-metal ağırlıklı dörtlü, 2013'ten sonra ise üç davulcunun önde dizildiği yedi-sekiz kişilik 'arşivi yeniden yorumlayan' konser orkestrası geldi. Fripp, grubu hiçbir zaman nostalji aracı olarak görmedi; her kadro 'yeni bir sorunun cevabı' olarak tasarlandı.", "etki": "Tüm İngiliz prog'unun referans noktası; Yes ve Genesis'in karşı kutbu; prog metalin (Tool, Dream Theater) ve 90'lar dissonant prog'unun doğrudan atası.", "ipucu": ["Crimson'u tek bir grup gibi değil, ortak bir yöntemi paylaşan beş ayrı topluluk gibi dinle; her dönemin kendi dili var.", "1973–74 kadrosunu anlamanın yolu canlı kayıtlardan geçer: stüdyo albümlerindeki parçaların çoğu sahne doğaçlamalarından kurgulandı (Starless and Bible Black'in büyük kısmı canlıdır).", "'Larks' Tongues in Aspic' serisini (Bölüm I–V, 1973–2003) bir iplik gibi takip et; Crimson'un her dönemi kendi 'Larks'ını yazdı.", "80'ler üçlemesinde (Discipline–Beat–Three of a Perfect Pair) Fripp ile Belew'in iç içe geçen ostinato gitarlarını ayrı ayrı kulaklarla izle — stereo kanallara ayrılmıştır."], "gecisler": "Giles, Giles & Fripp → King Crimson (1969). Greg Lake → ELP (1970). McDonald ve Giles → McDonald and Giles (1971); McDonald → Foreigner. Boz Burrell → Bad Company. John Wetton → Roxy Music, Uriah Heep, UK, Asia. Bill Bruford (Yes'ten) → UK, Bruford, Earthworks. Adrian Belew (Zappa, Bowie, Talking Heads'den). Yan projeler: ProjeKcts, 21st Century Schizoid Band, Stick Men."}, {"id": "john-wetton-solo", "name": "John Wetton", "sec": 4, "x": -452, "y": -303, "ext": false, "kurulus": "1949–2017, Derby. Family, King Crimson, Roxy Music (turne), Uriah Heep, U.K. ve Asia'nın basçısı-vokalisti.", "dna": "Distorsiyonlu, agresif bas; duygusal ve güçlü vokal; prog ile AOR arasında melodik şarkı yazarlığı.", "hikaye": "Wetton, ağın en hareketli 'göçmen' müzisyenidir: Mogul Thrash ve Family'den King Crimson'a (1972–74), oradan Roxy Music ve Uriah Heep'e, ardından U.K. ile Asia'ya uzanan bir yol çizdi. Karanlık, sert bası ve güçlü bariton-tenor sesiyle Crimson'un en ağır döneminin sesi, Asia'nın ise stadyum melodiciliği oldu. Alkol bağımlılığıyla mücadelesi ve 2007'deki kalp ameliyatı hayatının dönüm noktalarıydı. Solo kariyerinde AOR ve prog arasında gidip geldi; Geoff Downes'la Wetton/Downes (Icon) projesini yürüttü. 2017'de kolon kanseri nedeniyle öldü.", "etki": "Crimson–Asia hattının tek ortak sesi; prog ile arena rock'ı birleştiren kişi.", "ipucu": ["Caught in the Crossfire'ı (1980) U.K. ile Asia arasındaki eksik basamak olarak dinle: şarkılar şimdiden radyo kalıbında.", "Raised in Captivity bir 'aile buluşması': künyeyi okumadan önce her konuğun çalgısını tanımaya çalış.", "Ses için Starless and Bible Black ve Red'e, bas için canlı 'Easy Money'ye geri dön."], "gecisler": "Mogul Thrash → Family → King Crimson → Roxy Music → Uriah Heep → U.K. → Asia → Icon (Downes) → solo."}, {"id": "hugh-hopper", "name": "Hugh Hopper", "sec": 8, "x": 1425, "y": 102, "ext": false, "kurulus": "1945–2009, Canterbury. Basçı ve besteci; kardeşi Brian, Robert Wyatt ve Kevin Ayers'la birlikte Canterbury sahnesinin tohumu Wilde Flowers'ın üyesi.", "dna": "Solo enstrüman gibi kullanılan bozuk, melodik fuzz bas; aksak ölçülerde tekrar eden döngüler ve riff'ler; kuru bir mizah ve ham, bitmemiş olana düşkünlük.", "hikaye": "Hopper, 1969'da Kevin Ayers'ın yerine basa geçmeden önce Soft Machine'in turne sorumlusuydu; fuzz bası ve teyp döngüsü deneyleri Volume Two'dan Six'e kadarki albümleri belirledi, 'Facelift' ve 'Kings and Queens' gibi parçalar onundur. 1973'te ayrıldı ve Orwell'in romanından adını alan, teyp döngüleri ve tekrarlı bas parçalarından oluşan 1984'ü yaptı. Yetmişler ve seksenler boyunca Canterbury ve caz-rock grupları arasında dolaştı — Isotope, Gilgamesh, Stomu Yamash'ta, Carla Bley'in grubu, Elton Dean, Alan Gowen ve Pip Pyle'la Soft Heap — ve Hopper Tunity Box gibi solo albümler yayımladı. 2000'lerde Soft Works ve Soft Machine Legacy'de eski repertuvara döndü ve 2009'daki ölümünden kısa süre öncesine kadar kayıt yaptı.", "etki": "Hopper'ın döngüleri ve fuzz bası rock'ta minimalizmi, sonraki drone ve post-rock'ı önceden haber verir; Soft Machine'in en hipnotik müziğinin arkasındaki bestecidir.", "ipucu": ["Önce Third'deki 'Facelift'i dinle — onun parçası, onun bası.", "1984 rock'tan çok Terry Riley'ye yakın: bir teyp müziği eseri dinler gibi dinle."], "gecisler": "Wilde Flowers → Soft Machine (1969–73) → solo → Isotope → Gilgamesh → Carla Bley grubu → Soft Heap / Soft Head → Soft Works → Soft Machine Legacy (2004–09). Robert Wyatt'ın, Kevin Ayers'ın ve Syd Barrett'ın kayıtlarında çaldı."}, {"id": "robert-fripp-solo-ve-ortaklklar", "name": "Robert Fripp", "sec": 4, "x": -550, "y": -547, "ext": false, "kurulus": "1946, Wimborne, Dorset. King Crimson'un kurucusu ve tek kalıcı üyesi.", "dna": "Tremolo-picking, kesintisiz legato solo, döngü (loop) katmanları; Gurdjieff'ten beslenen disiplin felsefesi.", "hikaye": "Fripp, Crimson'u 1974'te dağıttıktan sonra J. G. Bennett'in Sherborne House'undaki düşünce okulunda bir yıl geçirdi; ardından Brian Eno ile iki teyp makinesiyle döngüler kurduğu 'Frippertronics' tekniğini geliştirdi. New York'ta Bowie ('Heroes'), Gabriel, Blondie ve Talking Heads ile çalıştı. 1985'te Guitar Craft adlı gitar okulu ve yeni akordu (New Standard Tuning) başlattı; öğrencileri The League of Crafty Guitarists oldu. 90'larda 'Soundscapes' adlı gerçek zamanlı döngü doğaçlamalarına geçti. Discipline Global Mobile (DGM) şirketiyle sanatçı hakları konusunda öncü bir tavır aldı. 2010'larda eşi Toyah Willcox ile internet videolarıyla yeni bir kitleye ulaştı.", "etki": "Ambient müziğin (Eno ile) ve looping tekniklerinin öncüsü; prog'dan post-rock'a uzanan bir yöntem öğretmeni.", "ipucu": ["Exposure'u Fripp'in 1977–78 'günlüğü' olarak dinle: Gabriel'in ikinci albümü ve Hall'un Sacred Songs'u ile bir üçlemenin üçüncü parçası olarak tasarlandı.", "(No Pussyfooting) iki teyp ve bir gitardan ibaret: bir kez bunu bilerek dinle, sonra unut.", "The First Day, 90'ların Crimson'ına köprü: riff'ler ve Trey Gunn'ın Stick'i doğrudan THRAK'a götürür."], "gecisler": "Giles, Giles & Fripp → King Crimson → Fripp & Eno → Bowie/Gabriel oturumları → The League of Gentlemen → Guitar Craft → Fripp & Andy Summers → Sylvian/Fripp → ProjeKcts."}, {"id": "caravan", "name": "Caravan", "sec": 8, "x": 546, "y": -245, "ext": false, "kurulus": "1968, Canterbury. Wilde Flowers (Soft Machine'le ortak kök) üyeleri Pye Hastings, Richard Sinclair, Dave Sinclair, Richard Coughlan ile kuruldu.", "dna": "Melodik Canterbury; uzun füzyon süitleri ama daha pastoral, mizahi ve İngiliz.", "hikaye": "Wilde Flowers'ın 'melodik' kolundan doğan Caravan (Pye Hastings, Richard ve David Sinclair, Richard Coughlan), Canterbury'nin en pop-dostu, en İngiliz ve en sıcak grubudur. Hastings'in yumuşak vokali ve Dave Sinclair'in fuzz orgu grubun imzası oldu. Kuzenler Richard ve Dave Sinclair 1972'de Hatfield and the North'un temellerini atmak için ayrıldı; grup ardından viyola ustası Geoffrey Richardson'la orkestral bir yöne yöneldi. 80'lerde dağınık, 90'lardan beri Hastings liderliğinde düzenli olarak kayıt ve turne yapıyor; Coughlan 2013'te öldü.", "etki": "Pek çok dinleyici için 'Canterbury sesi'nin tanımı; In the Land of Grey and Pink onun en sevilen albümü, pastoral ve esprili İngilizliği Big Big Train gibi sonraki melodik prog'da yankılanır.", "ipucu": ["In the Land of Grey and Pink'in ikinci yüzünün tamamı olan 'Nine Feet Underground' ile başla: Dave Sinclair'in orgu en iyi hâlinde.", "İki sese kulak ver: Richard Sinclair'in sıcak baritonu ve Pye Hastings'in yumuşak tenoru 1972'ye kadar sırayla söyler.", "For Girls Who Grow Plump in the Night, Sinclair sonrası grubu Geoffrey Richardson'ın viyolasıyla gösterir — daha rock ve daha orkestral."], "gecisler": "Wilde Flowers → Caravan (1968). Richard Sinclair → Hatfield and the North (1972) → Camel (1977). Dave Sinclair → Matching Mole (1972), kısa süre Hatfield. Steve Miller Delivery'den. John G. Perry → Quantum Jump, Anthony Phillips. Mike Wedgwood Curved Air'den. Jan Schelhaas → Camel (1978)."}, {"id": "dave-stewart-barbara-gaskin", "name": "Dave Stewart & Barbara Gaskin", "sec": 8, "x": 331, "y": 628, "ext": false, "kurulus": "1981, Londra. Klavyeci Dave Stewart (1950 doğumlu; Uriel, Egg, Hatfield and the North, National Health, Bruford) ve şarkıcı Barbara Gaskin (Spirogyra, Hatfield'ın 'Northettes'i).", "dna": "İçine Canterbury armonisi gizlenmiş titiz, katmanlı synthesizer pop: alışılmadık akor değişimleri, tek sayılı ölçü uzunlukları ve Gaskin'in berrak, zorlamasız sesi.", "hikaye": "Stewart, Gaskin'le yetmişlerin başında, Gaskin Spirogyra'da ve Amanda Parsons ve Ann Rosenthal'la birlikte Hatfield and the North albümlerinde Northettes olarak söylerken tanıştı. National Health ve Bruford'dan sonra Stewart, Colin Blunstone'la sürpriz bir hit yaptı ('What Becomes of the Broken Hearted', 1981), ardından Gaskin'le Lesley Gore'un 'It's My Party' şarkısının synthesizer'lı versiyonuyla İngiltere'de bir numara oldu (1981). İkili titizlikle üretilmiş pop yorumları ve kendi şarkılarıyla sürdü (Up from the Dark, The Big Idea, Spin); 2009'dan itibaren de kendi şirketleri Broken Records'tan daha uzun, daha kişisel albümler yayımladı (Green and Blue, Star Clocks). Stewart ayrıca rock müzisyenleri için iyi bilinen müzik teorisi kitaplarının yazarıdır.", "etki": "Canterbury armonisinin liste pop'unun içinde de yaşayabileceğinin kanıtı; Stewart'ın düzenlemeleri ve kitapları pek çok klavyeciyi etkiledi.", "ipucu": ["Önce Gaskin'in sesini Hatfield'ın 'Calyx'inde dinle.", "Green and Blue en 'Canterbury' albümleri: uzun şarkılar, aksak ölçüler, davulda Pip Pyle."], "gecisler": "Uriel / Arzachel → Egg → Khan → Hatfield and the North → National Health → Bruford (Stewart); Spirogyra → Hatfield'ın Northettes'i (Gaskin) → ikili (1981–). İkisi de sonra King Crimson'da çalan Gavin Harrison ve Jakko Jakszyk albümlerinde çaldı."}, {"id": "mcdonald-and-giles", "name": "McDonald and Giles", "sec": 4, "x": -1363, "y": 98, "ext": false, "kurulus": "1970, Londra. Ian McDonald (nefesliler, klavye, gitar) ve Michael Giles (davul), Aralık 1969'daki ilk ABD turnesinin sonunda King Crimson'dan ayrıldı ve birlikte tek bir albüm yaptı.", "dna": "Caz renkli düzenlemelerle yumuşak, İngiliz pastoral şarkı yazarlığı: flütler, saksafonlar ve Mellotron, Giles'ın hareketli, melodik davulu ve Crimson'ın ilk albümünün uzun biçimlerini tehdit duygusu olmadan hatırlatan bir yüz boyu süit ('Birdman').", "hikaye": "McDonald ve Giles, In the Court of the Crimson King'in büyük bölümünü yazmış ve çalmıştı; ama ikisi de turneden yorulmuştu ve Fripp'in istediği daha karanlık yönden huzursuzdu. Birkaç hafta arayla ayrıldılar; Giles yine de In the Wake of Poseidon'da stüdyo müzisyeni olarak çaldı. Tek albümleri McDonald and Giles (1971, Island), Crimson'ın seçmediği pastoral, melodik yolu gösterir: basta Peter Giles, org ve piyanoda konuk Steve Winwood, trombonda Michael Blakesley. Albüm az sattı, ikili hiç turneye çıkmadı. McDonald 1976'da Foreigner'ın kurucuları arasına katıldı; Michael Giles stüdyo davulcusu oldu ve sonradan McDonald, Mel Collins ve Peter Giles'la birlikte 21st Century Schizoid Band'de çaldı (2002–04).", "etki": "İlk King Crimson'ın melodik sıcaklığının ne kadarının McDonald'dan geldiğini gösteren bir kült albüm; süit biçimi ve pastoral tonu erken Genesis ve Camel'a yakın durur.", "ipucu": ["'Flight of the Ibis'i Crimson'ın 'Cadence and Cascade'iyle yan yana dinle — aynı melodi iki ayrı şarkıya dönüştü.", "'Birdman' yüz boyu süren süit: onu '21st Century Schizoid Man'in yumuşak ikizi gibi dinle."], "gecisler": "King Crimson (1969) → McDonald and Giles (1970–71) → Ian McDonald Foreigner'a (1976–79); Michael Giles stüdyo işlerine (Kevin Ayers, Anthony Phillips). Peter Giles daha önce Michael ve Robert Fripp'le Giles, Giles and Fripp'teydi. Üçü 21st Century Schizoid Band'de yeniden buluşur."}, {"id": "tony-levin", "name": "Tony Levin", "sec": 4, "x": -702, "y": -327, "ext": false, "kurulus": "1946'da Boston yakınında doğdu. Klasik kontrbas eğitimi almış, yetmişlerde New York'un en çok çalışan stüdyo müzisyenlerinden biri olmuş bir basçı.", "dna": "Bas, melodik bir solo ses olarak: Chapman Stick'te tapping, NS elektrikli kontrbas ve 'funk fingers' (parmaklarına bağladığı kısaltılmış bagetler) — hep groove'un hizmetinde ve bir stüdyo müzisyeninin tutumluluğuyla.", "hikaye": "Levin Eastman Müzik Okulu'nda okudu ve davulcu Steve Gadd'le birlikte New York stüdyo dünyasına girdi: Paul Simon, Alice Cooper (Welcome to My Nightmare), John Lennon ve Yoko Ono (Double Fantasy) ve yüzlercesi. Yapımcı Bob Ezrin onu 1977'de Peter Gabriel'ın ilk solo albümüne getirdi; o günden beri Gabriel'ın grubunda çalıyor. 1981'de Fripp, Belew ve Bruford'la yeni King Crimson'a katıldı ve gruba Chapman Stick'i getirdi; çifte üçlüye ve 2021'e kadar sonraki kadroların çoğuna geri döndü. ABWH'de (1989) ve Pink Floyd'un A Momentary Lapse of Reason'ında çaldı; 1998'de Bill Bruford, David Torn ve Chris Botti'yle Bruford Levin Upper Extremities'i, Dream Theater üyeleriyle Liquid Tension Experiment'i kurdu; 2010'dan beri Stick Men'i yönetiyor. Solo albümleri World Diary (1995) ile başladı; aynı zamanda fotoğrafçı ve turne günlükleri yazarı.", "etki": "Stick'i ve funk fingers'ı prog dilinin parçası yaptı; bu atlasın başka hiçbir basçısının bağlamadığı kadar çok düğümü bağlar: Crimson, Gabriel üzerinden Genesis yörüngesi, Yes (ABWH), Pink Floyd ve modern prog metal.", "ipucu": ["Bruford Levin Upper Extremities ile başla: doksanların Crimson ritim bölümü, Fripp'siz.", "Waters of Eden kendi yazdıklarının melodik, neredeyse ambient yanını gösterir.", "Levin Minnemann Rudess, Liquid Tension Experiment'e ve Dream Theater'a uzanan köprü."], "gecisler": "Stüdyo işleri (Paul Simon, Lennon, Alice Cooper) → Peter Gabriel (1977–) → King Crimson (1981–84, 1994–99, 2008, 2014–21) → ABWH (1989) → Bruford Levin Upper Extremities ve Liquid Tension Experiment (1998) → Stick Men ve Crimson ProjeKCt. Ayrıca Pink Floyd, Steven Wilson, Steve Hackett ve Yes ailesinden müzisyenlerin kayıtlarında."}, {"id": "soft-machine", "name": "Soft Machine", "sec": 8, "x": 731, "y": -328, "ext": false, "kurulus": "1966, Canterbury. Robert Wyatt, Kevin Ayers, Mike Ratledge, Daevid Allen ile kuruldu. Psychedelia'dan jazz-fusion'a evrildi.", "dna": "Org-fuzz dokusu, asimetrik ölçüler, jazz doğaçlama, deadpan İngiliz mizahı.", "hikaye": "Canterbury sahnesinin merkez düğümü. 1966'da Daevid Allen, Robert Wyatt, Kevin Ayers ve Mike Ratledge tarafından Wilde Flowers'ın kalıntılarından kuruldu; adı William Burroughs'un romanından alındı. Önce Pink Floyd'la birlikte Londra underground'ının psychedelic grubu, sonra İngiliz caz-rock'ının öncüsü oldu. Allen Fransa'da kalınca Gong'u, Ayers solo kariyerini, Wyatt 1971'de ayrılıp Matching Mole'u kurdu. 70'lerde Karl Jenkins ve John Marshall (Nucleus kökenli) ile tamamen fusion bir gruba dönüştü; Ratledge'in 1976'da ayrılmasıyla tek kurucu üye kalmadı. 2000'lerde Soft Machine Legacy adıyla Elton Dean, Hugh Hopper, John Marshall ve Theo Travis ile yeniden sahneye çıktı; 2015'ten sonra yeniden Soft Machine adını aldı.", "etki": "İngiliz caz-rock'ının taslağı ve Canterbury ağacının gövdesi: Gong, Matching Mole, Hatfield ve Robert Wyatt'ın solo işi hep ondan çıkar. Third (1970), bir rock grubunun plak yüzlerini bestelenmiş ve doğaçlama cazla doldurabileceğini gösterdi.", "ipucu": ["Önce Third'ü, sonra Fourth'u dinle: ilkinde 'Moon in June'da hâlâ Wyatt'ın sesi var, ikincisi artık enstrümantal caz.", "Mike Ratledge'in fuzz orgunu albümler boyunca takip et — 1976'ya kadar ana iplik o.", "Bundles'ta (1975) gitarda Allan Holdsworth var: grup birden gitar füzyonuna dönüşür."], "gecisler": "Sonra → Gong (Allen), Matching Mole (Wyatt), Nucleus köprüsü (Jenkins)."}, {"id": "the-wilde-flowers", "name": "The Wilde Flowers", "sec": 8, "x": 489, "y": -59, "ext": false, "kurulus": "1964, Canterbury. Brian Hopper, Hugh Hopper, Robert Wyatt, Kevin Ayers, Richard Sinclair; sonra Pye Hastings ve Richard Coughlan.", "dna": "R&B, beat, caz akorları, İngiliz şarkı yazarlığı; sonradan Canterbury sesinin tüm tohumları.", "hikaye": "Canterbury Scene'in 'anne grubu'. Canterbury'deki Wellington House'da, Daevid Allen'ın kiracı olduğu Wyatt ailesinin evinde toplanan gençler, caz, R&B ve Beatles etkisindeki şarkılarla sahneye çıktı. Grup hiç resmî albüm yayımlamadı; ama dağıldığında ortaya iki ana kol çıktı: Wyatt, Ayers ve Hugh Hopper'lı Soft Machine ile Hastings, Sinclair kuzenleri ve Coughlan'lı Caravan. Demo kayıtları 1994'te derlenerek yayımlandı.", "etki": "Canterbury'nin kökü; tek bir yerel grubun iki büyük grubu doğurmasının en saf örneği.", "ipucu": ["Derlemeyi bir aile albümü gibi dinle: sonradan Soft Machine ve Caravan'ın kaydettiği şarkıların ilk hâllerini duyacaksın.", "Wyatt'ın sesini takip et: Soft Machine'den önce burada zaten şarkıcı o."], "gecisler": "Wilde Flowers → Soft Machine (Wyatt, Ayers, H. Hopper) ve Caravan (Hastings, R. & D. Sinclair, Coughlan)."}, {"id": "projekcts", "name": "ProjeKcts", "sec": 4, "x": -210, "y": 141, "ext": false, "kurulus": "1997–1999. King Crimson'un double trio kadrosunun alt gruplara bölünerek doğaçlama 'araştırma ve geliştirme' yaptığı projeler.", "dna": "Serbest doğaçlama, elektronik davul, Warr gitar ve Soundscapes; jazz-metal-ambient arası laboratuvar.", "hikaye": "Fripp, 'fraKctalisation' dediği yöntemle altı kişilik Crimson'u küçük ve esnek alt gruplara ayırdı: ProjeKct One (Fripp, Gunn, Levin, Bruford), Two (Fripp, Gunn, Belew davulda — elektronik V-Drum), Three (Fripp, Gunn, Mastelotto) ve Four (Fripp, Gunn, Levin, Mastelotto). Tümü neredeyse tamamen doğaçlamaydı; bu çalışmalar The ConstruKction of Light ve The Power to Believe'in malzemesini üretti. Bruford ve Levin'in Crimson'dan fiilen ayrılması da bu dönemde gerçekleşti. 2000'lerde ProjeKct Six ve X da kayıtlar üretti.", "etki": "Crimson'un yöntemini (doğaçlamadan kompozisyona) açıkça belgeleyen, sonradan Crimson ProjeKCt ve Stick Men'e ilham olan çatı.", "ipucu": ["En kolay giriş Space Groove (ProjeKct Two): elektronik davulda Belew, yer yer neredeyse dans müziği.", "The ConstruKction of Light'ta (2000) yeniden çıkan riff ve dokulara kulak ver: yöntem burada denendi.", "Kutu seti bir oturuşta dinleme; her seferinde bir ProjeKct al ve kadroları karşılaştır."], "gecisler": "King Crimson (THRAK kadrosu) → ProjeKcts → King Crimson (2000 dörtlüsü); Trey Gunn ve Pat Mastelotto → TU; Levin → Stick Men."}, {"id": "hatfield-and-the-north-national-health-alt-dugumler", "name": "Hatfield and the North / National Health", "sec": 8, "x": 792, "y": 297, "ext": false, "kurulus": "Hatfield and the North: 1972–75, Londra. National Health: 1975–82, Dave Stewart ve Alan Gowen tarafından kuruldu.", "dna": "Birbirine akan uzun, baştan sona bestelenmiş parçalar; Dave Stewart'ın fuzz orgu, Phil Miller'ın lirik gitarı, rock enerjisiyle caz armonisi; sözsüz kadın sesleri ve absürt şarkı adları.", "hikaye": "Hatfield and the North (1972–75), Caravan'dan Richard Sinclair, Egg'den Dave Stewart, Delivery'den Phil Miller ve Pip Pyle'ın kurduğu Canterbury süpergrubudur; adını Londra'dan kuzeye giden otoyol tabelasından aldı. Northettes vokal üçlüsü (Amanda Parsons, Barbara Gaskin, Ann Rosenthal) grubun hafif, ironik ruhunu tamamladı. Dağılmasının ardından Stewart ve Alan Gowen (Gilgamesh) National Health'i kurdu: daha geniş, daha kompoze edilmiş Canterbury caz-rock'ı. Gowen'ın 1981'deki ölümünden sonra grup, onun bestelerinden oluşan D.S. al Coda ile kapandı.", "etki": "Canterbury besteciliğinin doruğu; The Rotters' Club ve Of Queues and Cures'ün birbirine geçen uzun parçaları, sonraki Canterbury esinli grupların (The Tangent vb.) referansı oldu; Jonathan Coe bir romanına The Rotters' Club adını verdi.", "ipucu": ["İlk Hatfield albümünü bir oturuşta dinle: parçalar aralıksız birbirine bağlanır, tek uzun bir eser gibi.", "The Rotters' Club'daki 'Mumps' zirve: Stewart'ın yazımının ve Northettes'in seslerinin buluştuğu 20 dakika.", "D.S. al Coda bir anma: bütün parçalar Alan Gowen'ın, onun ölümünden sonra kaydedildi."], "gecisler": "Caravan (Sinclair), Egg (Stewart), Delivery ve Matching Mole (Miller), Delivery ve Gong (Pyle) → Hatfield (1972) → National Health (1975; Stewart, Miller, Pyle + Gilgamesh'ten Gowen). Neil Murray → Colosseum II, Whitesnake. John Greaves Henry Cow'dan. Stewart → Bruford, sonra Barbara Gaskin'le Stewart & Gaskin."}, {"id": "21st-century-schizoid-band", "name": "21st Century Schizoid Band", "sec": 4, "x": -672, "y": -65, "ext": false, "kurulus": "2002, Londra. 1969–72 King Crimson mezunlarının kurduğu tribute/yeniden yorum grubu.", "dna": "1969–72 Crimson repertuvarı, McDonald'ın nefeslileri ve Collins'in saksafonu; saygılı ama canlı yorum.", "hikaye": "Ian McDonald, Michael Giles, Peter Giles, Mel Collins ve vokal-gitarda Jakko Jakszyk'ten oluşan grup, Fripp'in sahneye taşımadığı erken dönem Crimson repertuvarını (Poseidon, Lizard, Islands dahil) orijinal müzisyenlerin elinden dinletti. Michael Giles kısa sürede yerini Ian Wallace'a bıraktı. Grup birkaç turne ve canlı albümün ardından dağıldı; ancak asıl önemi, Jakko Jakszyk'in bu deneyimle 2013'te King Crimson'ın resmi vokalisti ve gitaristi olmasıdır.", "etki": "Fripp'i erken dönem repertuvarı yeniden sahneye taşımaya teşvik eden köprü proje.", "ipucu": ["Buradaki 'Pictures of a City' ve 'Cirkus'u orijinalleriyle karşılaştır: aynı müzisyenler otuz yıl sonra onları daha gevşek ve caz kokulu çalıyor.", "A Scarcity of Miracles'ı 2014 King Crimson'ının uvertürü olarak dinle: Jakszyk, Collins, Levin ve Harrison zaten orada."], "gecisler": "King Crimson (1969–72 kadrosu) → 21CSB → Jakszyk ve Collins King Crimson'a (2013). İlgili: Jakszyk, Fripp, Collins (A Scarcity of Miracles, 2011)."}, {"id": "matching-mole", "name": "Matching Mole", "sec": 8, "x": 986, "y": 737, "ext": false, "kurulus": "1971, Londra. Robert Wyatt'ın (Soft Machine davulcu/vokalisti) Soft Machine'in saf fusion'a kaymasından sonra kurduğu grup. Ad, Fransızca 'Machine Molle' (Soft Machine) kelime oyunu.", "dna": "Şarkı-formatlı Canterbury: Wyatt'ın kırılgan, melankolik vokali ve melodik bestesi; jazz-rock doğaçlama ile pop hassasiyetinin birleşimi. Soft Machine'in 'şarkı' yüzünün devamı.", "hikaye": "Robert Wyatt 1971'de Soft Machine'den ayrıldıktan sonra Phil Miller (gitar), Bill MacCormick (bas, Quiet Sun'dan) ve Caravan'dan Dave Sinclair ile kendi grubunu kurdu; Sinclair'in yerini kısa sürede Dave MacRae aldı. İlk albüm (1972), Wyatt'ın en yumuşak aşk şarkılarından 'O Caroline' ile açılır; ikincisi Matching Mole's Little Red Record'un yapımcısı Robert Fripp'ti, synthesizer'da Brian Eno vardı, sesler arasında oyuncu Julie Christie de yer aldı. Grup 1972 sonunda dağıldı; Wyatt yeni bir kadro planlarken Haziran 1973'teki düşüşü davul kariyerini bitirdi.", "etki": "Wyatt'ın Soft Machine sonrası sesinin köprüsü; Phil Miller'ı Hatfield'a taşıdı. Wyatt'ın trajik kazasından (1973) hemen önceki son grup kaydı.", "ipucu": ["'O Caroline'i, sonra Rock Bottom'dan 'Sea Song'u dinle: kazadan önce ve sonra aynı ses.", "Little Red Record'da Fripp'in prodüksiyonuna ve Eno'nun synthesizer'ına kulak ver — Canterbury, Crimson ve Roxy Music'in buluşma noktası."], "gecisler": "Önce → Soft Machine (Wyatt). Sonra → Hatfield and the North (Phil Miller), Wyatt'ın solo kariyeri (1973 felç kazası sonrası). Soft Machine 'Third'ü Hatfield'a bağlayan köprü."}, {"id": "alan-parsons-project", "name": "The Alan Parsons Project", "sec": 16, "x": 1732, "y": -124, "ext": true}, {"id": "allan-holdsworth", "name": "Allan Holdsworth", "sec": 9, "x": -68, "y": 2360, "ext": true}, {"id": "anderson-bruford-wakeman-howe-abwh", "name": "Anderson Bruford Wakeman Howe", "sec": 5, "x": -1854, "y": 483, "ext": true}, {"id": "anthony-phillips", "name": "Anthony Phillips", "sec": 7, "x": -844, "y": -1189, "ext": true}, {"id": "arena", "name": "Arena", "sec": 11, "x": 316, "y": -1965, "ext": true}, {"id": "art-bears", "name": "Art Bears", "sec": 24, "x": 1740, "y": 1128, "ext": true}, {"id": "asia", "name": "Asia", "sec": 9, "x": -271, "y": 1904, "ext": true}, {"id": "bill-bruford-s-earthworks", "name" ı, söz yazarı ve multi-entrümantalist. Rock grubu Genesis'in vokalisti ve davulcusu olarak tanınan Collins, solo albümleriyle büyük bir ticari başarı yakalamış ve Grammy Ödülü kazanmıştır. ...But Seriously adlı 1989 albümünde yer alan \"Another Day in Paradise\" adlı evsizlerin ve sokakta yaşayanların sorunlarına dikkat çeken parça, Phil Collins'e ve albümün yapımcısı Hugh Padgham'a 1991 Grammy Ödülü'nü kazandırmıştır. Ayrıca Collins, Tarzan filminin müzikleriyle Oscar ve Altın Küre Ödülü kazanmıştır.", "gs": [["genesis", 1971, 2007, ["vox,drums", "vox,drums,perc"]], ["steve-hackett-solo-dugum", 1975, 1975, ["vox,drums,perc"]], ["brian-eno", 1975, 1978, ["drums", "drums,perc", "perc"]], ["brand-x", 1976, 1980, ["drums", "drums,perc", "vox,drums,perc", "vox,key,drums"]], ["anthony-phillips", 1977, 1977, ["vox,other"]], ["robert-fripp-solo-ve-ortaklklar", 1979, 1979, ["drums"]], ["peter-gabriel-solo-dugum", 1980, 1980, ["drums"]], ["robert-plant", 1982, 1983, ["drums"]]]}, {"id": "andy-summers", "name": "Andy Summers", "x": -368, "y": -1325, "bio": "Andrew James Summers (d. 31 Aralık 1942) en çok rock grubu The Police'in üyesi olarak tanınan İngiliz gitarist. Police'e katılmadan önce 1960'larda Zoot Money's Big Roll Band, Dantalian's Chariot, Soft Machine ve The Animals gibi gruplarda çaldı. 1970'lerin ilk yarısını müzik eğitimini ilerleterek geçirdi, 1975'te profesyonel müziğe döndü ve iki yıl sonra Police'e katıldı.", "gs": [["jon-lord", 1976, 1976, ["gtr"]], ["robert-fripp-solo-ve-ortaklklar", 1982, 1982, ["gtr,bass,key,perc,prod"]]]}, {"id": "martin-barre", "name": "Martin Barre", "x": -2073, "y": -72, "bio": "Martin Lancelot Barre (d. 17 Kasım 1946) İngiliz gitarist. 1968'den grubun 2011'deki ilk dağılışına kadar kayıt yaptığı ve turneye çıktığı İngiliz rock grubu Jethro Tull'un solo gitaristiydi. 1969 tarihli Stand Up'tan (ilk albümde çalan Mick Abrahams'ın yerine) 2003 tarihli The Jethro Tull Christmas Album'e kadar grubun bütün stüdyo albümlerinde çaldı.", "gs <script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const COVER_BASES=['kapaklar/','../kapaklar/','../../prog-rock-atlas/kapaklar/'];
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=v=>{if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim().startsWith('[')){try{return JSON.parse(v)}catch(e){try{return JSON.parse(v.replace(/'/g,'"'))}catch(e2){}}}return v?[v]:[]};

/* ---------- index ---------- */
const N={}; // id -> {type, obj, el, x,y, nb:Set}
const secById={};D.sections.forEach(s=>secById[s.no]=s);
const albByGroup={};D.albums.forEach(a=>(albByGroup[a.g]=albByGroup[a.g]||[]).push(a));
const personsByGroup={};
D.groups.forEach(g=>N['g:'+g.id]={type:'g',o:g,x:g.x,y:g.y,nb:new Set()});
D.persons.forEach(p=>{N['p:'+p.id]={type:'p',o:p,x:p.x,y:p.y,nb:new Set()};
  p.gs.forEach(([gid])=>{(personsByGroup[gid]=personsByGroup[gid]||[]).push(p);link('p:'+p.id,'g:'+gid)})});
D.albums.forEach(a=>{N['a:'+a.id]={type:'a',o:a,x:a.x,y:a.y2,nb:new Set()};link('a:'+a.id,'g:'+a.g);
  a.k.forEach(([pid])=>{if(N['p:'+pid])link('a:'+a.id,'p:'+pid)})});
function link(a,b){N[a].nb.add(b);N[b].nb.add(a)}
const personIds=new Set(D.persons.map(p=>p.id));

/* ---------- draw ---------- */
const world=$('#world'),gR=$('#regions'),gE=$('#edges'),gN=$('#nodes'),svg=$('#svg');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
// regions: soft blobs per section (circle around group centroid)
D.sections.forEach(s=>{
  const gs=D.groups.filter(g=>g.sec===s.no);
  let r=0;gs.forEach(g=>r=Math.max(r,Math.hypot(g.x-s.x,g.y-s.y)));
  r=Math.max(r+(s.main?150:90),s.main?320:160);
  if(s.main)el('circle',{cx:s.x,cy:s.y,r,class:'region main'},gR);
  s.r=r;
});
const edgeEls=[];
function addEdge(a,b,cls){const A=N[a],B=N[b];const e=el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'e '+cls},gE);e._a=a;e._b=b;edgeEls.push(e)}
D.persons.forEach(p=>p.gs.forEach(([gid])=>addEdge('p:'+p.id,'g:'+gid,'pe'+(N['g:'+gid].o.ext?' out':''))));
D.albums.forEach(a=>addEdge('a:'+a.id,'g:'+a.g,'al'));
// albums
D.albums.forEach(a=>{const n=N['a:'+a.id];const g=el('g',{class:'n a','data-id':'a:'+a.id,transform:`translate(${n.x},${n.y})`},gN);
  el('rect',{x:-16,y:-16,width:32,height:32,rx:3},g);
  const im=el('image',{x:-16,y:-16,width:32,height:32,preserveAspectRatio:'xMidYMid slice'},g);setCover(im,a.cov,true);
  n.el=g});
// persons
D.persons.forEach(p=>{const n=N['p:'+p.id];const g=el('g',{class:'n p'+(p.gs.length>=4?' big':''),'data-id':'p:'+p.id,transform:`translate(${n.x},${n.y})`},gN);
  el('circle',{class:'hit',r:16},g).classList.add('hit');el('circle',{},g);
  const t=el('text',{class:'lbl',x:0,y:0,dy:'1.9em','text-anchor':'middle'},g);t.textContent=p.name;n.el=g});
// groups
D.groups.forEach(gr=>{const n=N['g:'+gr.id];const g=el('g',{class:'n g'+(gr.ext?' ext':'')+(!gr.ext&&(albByGroup[gr.id]||[]).length>=10?' major':''),'data-id':'g:'+gr.id,transform:`translate(${n.x},${n.y})`},gN);
  el('circle',{class:'hit',r:22},g);el('circle',{},g);
  const t=el('text',{class:'lbl',x:0,y:0,dy:'-1.1em','text-anchor':'middle'},g);t.textContent=gr.name;n.el=g});
// fix: hit circles must not inherit styled radius
document.querySelectorAll('circle.hit').forEach(c=>c.style.r=c.getAttribute('r')+'px');
// region labels on top
D.sections.forEach(s=>{const t=el('text',{class:'rlabel'+(s.main?' main':' ext'),x:s.x,y:s.main?s.y-s.r+40:s.y},gN);t.textContent=s.t});

function setCover(img,cov,isSvg){
  let i=0;const tryNext=()=>{if(i>=COVER_BASES.length){return}
    const url=COVER_BASES[i++]+cov.replace(/^kapaklar\//,'');
    const probe=new Image();probe.onload=()=>{isSvg?img.setAttribute('href',url):img.style.backgroundImage=`url("${url}")`};probe.onerror=tryNext;probe.src=url};
  tryNext();
}

/* ---------- camera ---------- */
let cam={x:0,y:0,s:.3};
const W=()=>innerWidth,H=()=>innerHeight;
function sheetPx(){return sheetState==='closed'?0:sheetState==='peek'?peekH():SH()}
function SH(){return document.getElementById('sheet').offsetHeight||H()*.88}
function peekH(){return Math.min(H()*.42,340)}
function apply(){
  world.setAttribute('transform',`translate(${W()/2-cam.x*cam.s},${(H()-visibleSheet()-DK())/2-cam.y*cam.s}) scale(${cam.s})`);
  svg.style.setProperty('--k',1/cam.s);

  if(ptr.size===2){const [p1,p2]=[...ptr.values()];startDist=Math.hypot(p1.x-p2.x,p1.y-p2.y);startS=cam.s;startCam={...cam,mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2};moved=99}
  map.classList.add('drag')});

    if(moved>6){cam.x=startCam.x-dx/cam.s;cam.y=startCam.y-dy/cam.s;apply()}}
  else if(ptr.size===2){const [p1,p2]=[...ptr.values()];const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    zoomAt(startCam.mx,startCam.my,clampS(startS*d/startDist),startCam);cam.x-= (mx-startCam.mx)/cam.s;cam.y-=(my-startCam.my)/cam.s;apply()}});

function frame(n){
  if(n.type==='a'){fly(n.x,n.y,1.3);return}
  const pts=[n,...[...n.nb].map(b=>N[b]).filter(m=>n.type!=='g'||m.type!=='a'||true)];
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const vw=W()-48,vh=H()-peekH()-150;
  let s=Math.min(vw/Math.max(x1-x0,1),vh/Math.max(y1-y0,1));
  s=Math.max(.22,Math.min(n.type==='a'?1.4:1.1,s));
  // keep selected node visible: center on bbox, but if node would fall outside, center on node
  let cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(Math.abs(n.x-cx)*s>vw/2||Math.abs(n.y-cy)*s>vh/2){cx=n.x;cy=n.y}
